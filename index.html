<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>互動句式語言訓練百寶箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  <!-- 自動載入你同一個資料夾入面嘅 questions.js 題庫檔 -->
  <script src="questions.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #FFFBEB 0%, #FEF3C7 50%, #E0F2FE 100%);
    }
    .tactile-btn {
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
      box-shadow: 0 5px 0 rgba(15, 23, 42, 0.15);
      touch-action: manipulation;
    }
    .tactile-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.15);
    }
    .pattern-menu-card {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      box-shadow: 0 10px 0 rgba(15, 23, 42, 0.1), 0 14px 28px rgba(15, 23, 42, 0.08);
      touch-action: manipulation;
    }
    .pattern-menu-card:active {
      transform: translateY(4px) scale(0.985);
      box-shadow: 0 3px 0 rgba(15, 23, 42, 0.1);
    }
    .storybook-card {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
      box-shadow: 0 7px 0 rgba(15, 23, 42, 0.1), 0 10px 20px rgba(15, 23, 42, 0.07);
      touch-action: none;
    }
    .storybook-card:active { transform: scale(0.97); }
    @keyframes slot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .slot-targeted {
      animation: slot-pulse 1s ease-in-out infinite;
      box-shadow: 0 0 0 5px #FBBF24 !important;
      background-color: #FFFBEB !important;
    }
    .slot-hover-target {
      transform: scale(1.03) !important;
      box-shadow: 0 0 0 5px #F59E0B !important;
      background-color: #FEF3C7 !important;
    }
    @keyframes karaoke-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1.02); }
    }
    .karaoke-active {
      transform: scale(1.03) !important;
      box-shadow: 0 0 0 7px #FACC15, 0 12px 24px rgba(250, 204, 21, 0.45) !important;
      z-index: 30;
      animation: karaoke-pop 0.35s ease-out forwards;
    }
    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px) rotate(-1.5deg); }
      40% { transform: translateX(9px) rotate(1.5deg); }
      60% { transform: translateX(-6px) rotate(-1deg); }
      80% { transform: translateX(6px) rotate(1deg); }
    }
    .shake-feedback { animation: gentle-shake 0.55s ease-in-out; }
    @keyframes pop-in {
      0% { transform: scale(0.9); opacity: 0; }
      70% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: pop-in 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
  </style>
</head>
<body class="w-full h-full flex flex-col justify-between overflow-hidden select-none">

  <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>
  <div id="touchDragGhost" class="fixed pointer-events-none z-50 hidden" style="width: 175px; height: 165px; transform: translate(-50%, -50%) rotate(2deg);"></div>

  <!-- VIEW 1: 🏠 句式練習主頁 -->
  <div id="homeScreen" class="w-full h-full flex flex-col justify-between px-3.5 sm:px-8 py-3 sm:py-5 max-w-6xl mx-auto">
    <header class="shrink-0 flex items-center justify-between gap-2 pb-1">
      <div class="flex items-center gap-2.5 sm:gap-3.5">
        <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-2xl bg-amber-400 border-3 border-amber-500 shadow flex items-center justify-center text-2xl sm:text-3xl">🗣️</div>
        <div>
          <h1 class="text-xl sm:text-3xl font-black text-slate-800 tracking-tight">句式練習百寶箱</h1>
          <p class="text-xs sm:text-sm font-bold text-slate-500">撳一下句式大圖卡開始練習</p>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="bg-white/95 border-2 border-amber-300 rounded-full px-3.5 sm:px-5 py-1.5 flex items-center gap-1.5 shadow-sm">
          <span class="text-lg sm:text-2xl">⭐</span>
          <span id="homeStarCount" class="text-base sm:text-xl font-black text-slate-800">0</span>
        </div>
        <button onclick="openTeacherModal()" aria-label="設定" class="tactile-btn w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-white/90 hover:bg-white text-slate-600 border-2 border-slate-300 flex items-center justify-center text-xl">⚙️</button>
      </div>
    </header>

    <main class="flex-1 min-h-0 flex items-center justify-center py-1.5 sm:py-3 overflow-y-auto thin-scroll">
      <div id="patternMenuGrid" class="w-full h-full max-h-[580px] grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-stretch"></div>
    </main>

    <footer class="shrink-0 pt-1 text-center">
      <div class="inline-flex items-center gap-2 bg-white/85 border-2 border-amber-200 px-4 py-1.5 rounded-full text-xs sm:text-sm font-black text-slate-600 shadow-sm">
        <span>👆</span>
        <span>請選擇「因為…所以…」或者「首先…跟住…然後…最後…」開始練習！</span>
      </div>
    </footer>
  </div>

  <!-- VIEW 2: 🎯 句式互動訓練畫面 -->
  <div id="trainingScreen" class="hidden w-full h-full flex flex-col justify-between overflow-hidden">
    <header class="shrink-0 px-2.5 sm:px-6 pt-2 pb-1 flex items-center justify-between z-20 max-w-6xl w-full mx-auto gap-1.5">
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="goToHomeScreen()" class="tactile-btn bg-white hover:bg-amber-50 text-slate-800 border-2 border-amber-300 px-2.5 sm:px-3.5 h-10 sm:h-11 rounded-full flex items-center gap-1 font-black text-xs sm:text-base">
          <span class="text-base sm:text-lg">🏠</span><span class="hidden sm:inline">主頁</span>
        </button>
        <button id="activePatternBadgeBtn" onclick="switchActivePatternQuick()" class="tactile-btn bg-amber-100 hover:bg-amber-200 text-amber-950 border-2 border-amber-300 px-2.5 sm:px-3.5 h-10 sm:h-11 rounded-full flex items-center gap-1 font-black text-xs sm:text-sm">
          <span id="activePatternBadgeText">因為…所以…</span><span class="text-[10px] opacity-70">🔄</span>
        </button>
        <button onclick="prevQuestion()" class="tactile-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-white hover:bg-amber-50 text-slate-700 border-2 border-amber-300 flex items-center justify-center font-black text-sm sm:text-lg">◀</button>
        <div class="bg-white/95 border-2 border-amber-300 rounded-full px-2.5 sm:px-3.5 py-1 flex items-center gap-1 shadow-sm">
          <span class="text-sm sm:text-lg">⭐</span>
          <span id="progressText" class="text-xs sm:text-lg font-black text-slate-800">1 / 8</span>
        </div>
        <button onclick="nextQuestion()" class="tactile-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-white hover:bg-amber-50 text-slate-700 border-2 border-amber-300 flex items-center justify-center font-black text-sm sm:text-lg">▶</button>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="speakCurrentSentence(true)" class="tactile-btn bg-amber-400 hover:bg-amber-300 text-slate-900 border-2 border-amber-500 px-3.5 sm:px-5 h-10 sm:h-11 rounded-full font-black text-xs sm:text-lg flex items-center gap-1 sm:gap-1.5">
          <span class="text-base sm:text-xl">🔊</span><span>讀句子</span>
        </button>
        <button onclick="openTeacherModal()" class="tactile-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/90 hover:bg-white text-slate-600 border-2 border-slate-300 flex items-center justify-center text-base sm:text-lg">⚙️</button>
      </div>
    </header>

    <main class="flex-1 min-h-0 px-2.5 sm:px-6 pb-2.5 sm:pb-4 pt-1 flex flex-col justify-between gap-2 sm:gap-3.5 max-w-6xl w-full mx-auto">
      <section class="flex-1 min-h-0 bg-white/90 rounded-[1.75rem] sm:rounded-[2rem] p-2 sm:p-3.5 border-4 border-amber-200 shadow-sm flex flex-col justify-center relative">
        <div id="topSlotsContainer" class="w-full h-full"></div>
        <div id="actionOverlayBar" class="hidden absolute inset-x-0 -bottom-3.5 sm:-bottom-4 flex justify-center z-30 pointer-events-none">
          <div id="actionOverlayContent" class="pointer-events-auto flex items-center gap-2"></div>
        </div>
      </section>

      <section class="flex-1 min-h-0 bg-white/85 rounded-[1.75rem] sm:rounded-[2rem] p-2 sm:p-3.5 border-4 border-amber-200/90 shadow-sm flex flex-col justify-center">
        <div id="cardTray" class="w-full h-full"></div>
      </section>
    </main>
  </div>

  <!-- VIEW 3: ⚙️ 老師／家長設定面板 -->
  <div id="teacherModal" onclick="if(event.target === this) closeTeacherModal()" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-5">
    <div class="bg-white rounded-[2rem] max-w-xl w-full max-h-[90dvh] overflow-y-auto thin-scroll border-4 border-slate-300 shadow-2xl p-4 sm:p-6 space-y-4 animate-pop">
      <div class="flex items-center justify-between border-b-2 border-slate-100 pb-3">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">⚙️</span>
          <div>
            <h2 class="text-lg sm:text-xl font-black text-slate-800">家長／老師設定面板</h2>
            <p class="text-xs font-bold text-slate-500">切換句式、難度及語音（已獲 ⭐ <span id="teacherStarCount">0</span> 粒星）</p>
          </div>
        </div>
        <button onclick="closeTeacherModal()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-lg flex items-center justify-center">✕</button>
      </div>

      <div class="bg-amber-50 p-3.5 rounded-2xl border-2 border-amber-200 space-y-2">
        <div class="text-xs sm:text-sm font-black text-amber-950">🗣️ 選擇練習句式：</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <button type="button" id="modalPatCausalBtn" onclick="selectPatternFromModal('because_therefore')" class="py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 text-left flex items-center justify-between">
            <span>1️⃣ 因為 … 所以 … (因果2格)</span><span>▶️</span>
          </button>
          <button type="button" id="modalPatSeqBtn" onclick="selectPatternFromModal('sequence_4step')" class="py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 text-left flex items-center justify-between">
            <span>2️⃣ 首先…跟住…然後…最後… (次序4格)</span><span>▶️</span>
          </button>
        </div>
      </div>

      <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
        <label class="block text-xs sm:text-sm font-black text-slate-700">📚 選擇當前句式練習題目：</label>
        <select id="questionSelect" onchange="jumpToQuestion(this.value)" class="w-full bg-white border-2 border-amber-300 text-slate-800 font-black rounded-xl px-3 py-2 text-sm focus:outline-none"></select>
      </div>

      <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
        <div class="text-xs sm:text-sm font-black text-slate-700">🎯 訓練難度階段：</div>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="setDifficulty(1)" id="diffBtn1" class="py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2">🌱 初階 (基礎輔助)</button>
          <button type="button" onclick="setDifficulty(2)" id="diffBtn2" class="py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2">🌿 中階 (進階挑戰)</button>
          <button type="button" onclick="setDifficulty(3)" id="diffBtn3" class="py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2">🌳 高階 (完整重組)</button>
        </div>
        <p id="diffDescText" class="text-[11px] font-bold text-slate-500"></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
          <div class="text-xs sm:text-sm font-black text-slate-700">💬 圖卡文字顯示模式：</div>
          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" onclick="setTextMode('cantonese')" id="tmBtnCantonese" class="py-2 px-1.5 rounded-xl font-black text-xs border-2">廣東話口語</button>
            <button type="button" onclick="setTextMode('written')" id="tmBtnWritten" class="py-2 px-1.5 rounded-xl font-black text-xs border-2">標準書面語</button>
            <button type="button" onclick="setTextMode('none')" id="tmBtnNone" class="py-2 px-1.5 rounded-xl font-black text-xs border-2">🖼️ 純圖卡</button>
          </div>
        </div>

        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
          <div class="text-xs sm:text-sm font-black text-slate-700">🔊 語音與語速設定：</div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="toggleVoiceLang()" id="voiceLangBtn" class="flex-1 py-2 px-3 rounded-xl font-black text-xs bg-purple-100 text-purple-900 border-2 border-purple-300">🔊 粵語發音</button>
            <button type="button" onclick="toggleVoiceSpeed()" id="voiceSpeedBtn" class="flex-1 py-2 px-3 rounded-xl font-black text-xs bg-amber-100 text-amber-900 border-2 border-amber-300">🐢 慢速朗讀</button>
          </div>
        </div>
      </div>

      <button type="button" onclick="closeTeacherModal()" class="tactile-btn w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-2xl font-black text-base">完成設定並返回</button>
    </div>
  </div>

  <script>
    /********************************************************************
     * 1. 智能圖片讀取引擎 (自動支援 .jpg / .png / .webp + 防快取版本號)
     ********************************************************************/
    function buildImgPath(rawPath) {
      const ver = window.IMAGE_VERSION || 1;
      if (!rawPath) return '';
      if (rawPath.startsWith('data:') || rawPath.includes('?')) return rawPath;
      return `${rawPath}?v=${ver}`;
    }

    // 當 .jpg 讀唔到時，自動試 .png -> .JPG -> .webp，最後先顯示後備插圖並提示檔名
    function handleImgFallback(imgEl) {
      const raw = imgEl.getAttribute('data-raw-src') || '';
      const base = raw.replace(/\.(jpg|jpeg|png|webp)$/i, '');
      const ver = window.IMAGE_VERSION || 1;
      const step = parseInt(imgEl.getAttribute('data-retry-step') || '0', 10);

      const fallbacks = [`${base}.png?v=${ver}`, `${base}.JPG?v=${ver}`, `${base}.webp?v=${ver}`];
      if (step < fallbacks.length) {
        imgEl.setAttribute('data-retry-step', String(step + 1));
        imgEl.src = fallbacks[step];
      } else {
        imgEl.style.display = 'none';
        if (imgEl.nextElementSibling) imgEl.nextElementSibling.style.display = 'flex';
      }
    }

    function renderCardVisual(card) {
      const rawPath = card.img || (card.sceneKey ? `images/${card.sceneKey}.jpg` : '');
      const fullSrc = buildImgPath(rawPath);
      return `
        <div class="w-full h-full relative bg-slate-50 overflow-hidden">
          <img src="${fullSrc}" data-raw-src="${rawPath}" data-retry-step="0" alt=""
               class="w-full h-full object-cover animate-pop" draggable="false"
               onerror="handleImgFallback(this)" />
          <div style="display:none;" class="w-full h-full flex-col items-center justify-center relative">
            ${renderCuteSceneSVG(card.sceneKey)}
            <span class="absolute bottom-1 right-1 bg-slate-800/75 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
              待放入: ${rawPath}
            </span>
          </div>
        </div>
      `;
    }

    /********************************************************************
     * 2. 後備繪本圖案 (當某題暫時未放入相片時自動頂替，唔會穿崩)
     ********************************************************************/
    function renderCuteSceneSVG(sceneKey) {
      const map = {
        rain_cause: ['#475569','#334155','#FB7185'], rain_effect: ['#BAE6FD','#86EFAC','#FACC15'],
        hungry_cause: ['#FEF3C7','#FDE68A','#60A5FA'], hungry_effect: ['#FFFBEB','#FDBA74','#34D399'],
        dirty_cause: ['#FEF9C3','#FDE047','#A78BFA'], dirty_effect: ['#E0F2FE','#BAE6FD','#38BDF8'],
        hot_cause: ['#FFEDD5','#FED7AA','#FB923C'], hot_effect: ['#E0F2FE','#BAE6FD','#38BDF8'],
        sleepy_cause: ['#1E1B4B','#312E81','#818CF8'], sleepy_effect: ['#312E81','#1E1B4B','#60A5FA'],
        fall_cause: ['#BAE6FD','#86EFAC','#FB7185'], fall_effect: ['#FEF3C7','#FDE68A','#34D399'],
        toy_cause: ['#F1F5F9','#E2E8F0','#F472B6'], toy_effect: ['#E0E7FF','#C7D2FE','#60A5FA'],
        tidy_cause: ['#ECFDF5','#A7F3D0','#FBBF24'], tidy_effect: ['#FEF9C3','#FDE047','#34D399'],
        s1_1: ['#E0F2FE','#BAE6FD','#38BDF8'], s1_2: ['#E0F2FE','#93C5FD','#60A5FA'],
        s1_3: ['#DBEAFE','#93C5FD','#3B82F6'], s1_4: ['#FEF3C7','#FDE68A','#F472B6']
      };
      const [bgSky, bgFloor, shirtCol] = map[sceneKey] || ['#FEF3C7', '#A7F3D0', '#60A5FA'];
      return `
        <svg viewBox="0 0 260 185" class="w-full h-full">
          <rect width="260" height="135" fill="${bgSky}"/>
          <rect y="130" width="260" height="55" fill="${bgFloor}"/>
          <g transform="translate(130, 96)">
            <path d="M-34,64 C-34,20 34,20 34,64 Z" fill="${shirtCol}" stroke="#1E293B" stroke-width="3"/>
            <circle cx="0" cy="-6" r="32" fill="#FFE4E6" stroke="#78350F" stroke-width="3"/>
            <path d="M-32,-10 C-32,-42 32,-42 32,-10 C20,-22 9,-24 0,-20 C-9,-24 -20,-22 -32,-10 Z" fill="#451A03"/>
            <circle cx="-11" cy="-5" r="4" fill="#1E293B"/><circle cx="11" cy="-5" r="4" fill="#1E293B"/>
            <path d="M-9,5 Q0,16 9,5 Z" fill="#EF4444" stroke="#78350F" stroke-width="2"/>
          </g>
        </svg>
      `;
    }

    /********************************************************************
     * 3. 讀取 questions.js 題庫與程式狀態
     ********************************************************************/
    const BANK = window.QUESTION_BANK || { causal: [], sequence: [] };
    let causalQuestions = BANK.causal || [];
    let seqQuestions = BANK.sequence || [];

    let currentScreen = 'home';
    let activePatternId = 'because_therefore';
    let currentQuestionIndex = 0;
    let completedQuestionIds = new Set();

    let difficulty = 1;
    let textMode = 'cantonese';
    let voiceLang = 'zh-HK';
    let voiceRate = 0.85;
    let starCount = 0;

    let trayCards = [];
    let targetSlotKey = null;
    let slots = {};
    let lockedCorrectSlots = new Set();
    let isReadingKaraoke = false;
    let autoCheckTimer = null;
    let isCurrentQuestionSolved = false;

    let pointerDragState = { active: false, cardId: null, startX: 0, startY: 0, moved: false, hoveredSlotKey: null };

    function getActiveQuestionList() {
      return activePatternId === 'sequence_4step' ? seqQuestions : causalQuestions;
    }

    /********************************************************************
     * 4. 音效與語音朗讀
     ********************************************************************/
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        if (type === 'pop' || type === 'place') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.1);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.11);
        } else if (type === 'return' || type === 'gentleHint') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.16);
        } else if (type === 'success') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.09);
            g.gain.setValueAtTime(0.18, now + idx * 0.09);
            g.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.09 + 0.28);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + idx * 0.09); o.stop(now + idx * 0.09 + 0.29);
          });
        }
      } catch (e) {}
    }

    function speakText(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) setTimeout(callback, 400);
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = voiceLang;
      utter.rate = voiceRate;
      utter.pitch = 1.05;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.toLowerCase() === voiceLang.toLowerCase()) ||
                        voices.find(v => v.lang.toLowerCase().includes('zh'));
      if (preferred) utter.voice = preferred;
      utter.onend = () => { if (callback) callback(); };
      utter.onerror = () => { if (callback) callback(); };
      window.speechSynthesis.speak(utter);
    }

    function getCardSpokenText(c) {
      if (!c) return '';
      if (c.isConjunction) return c.text;
      return textMode === 'written' ? (c.written || c.cantonese) : (c.cantonese || c.written);
    }

    function getCardDisplayText(c) {
      if (!c) return '';
      if (c.isConjunction) return c.text;
      if (textMode === 'none') return '';
      return textMode === 'written' ? (c.written || c.cantonese) : (c.cantonese || c.written);
    }

    function getSequenceWord(stepNum) {
      if (stepNum === 1) return '首先';
      if (stepNum === 2) return textMode === 'written' ? '接著' : '跟住';
      if (stepNum === 3) return '然後';
      return '最後';
    }

    function speakCurrentSentence(forceReadTargetIfEmpty = false) {
      if (isReadingKaraoke) {
        window.speechSynthesis && window.speechSynthesis.cancel();
        clearKaraokeHighlights();
        isReadingKaraoke = false;
        return;
      }
      const qList = getActiveQuestionList();
      const q = qList[currentQuestionIndex];
      if (!q) return;
      let steps = [];

      if (activePatternId === 'sequence_4step') {
        for (let i = 1; i <= 4; i++) {
          const key = `step${i}`;
          const connWord = getSequenceWord(i);
          const cardObj = slots[key] || (forceReadTargetIfEmpty ? q.steps[i - 1] : null);
          const actionText = cardObj ? getCardSpokenText(cardObj) : `第${i}步`;
          steps.push({ text: `${connWord}，${actionText}`, elIds: [`slot-step${i}`] });
        }
      } else {
        const causeText = slots.cause ? getCardSpokenText(slots.cause) : (forceReadTargetIfEmpty ? getCardSpokenText(q.cause) : '原因');
        const effectText = slots.effect ? getCardSpokenText(slots.effect) : (forceReadTargetIfEmpty ? getCardSpokenText(q.effect) : '結果');
        steps = [
          { text: `因為，${causeText}`, elIds: ['slot-cause'] },
          { text: `所以，${effectText}`, elIds: ['slot-effect'] }
        ];
      }

      isReadingKaraoke = true;
      let idx = 0;
      function playNext() {
        clearKaraokeHighlights();
        if (idx >= steps.length || !isReadingKaraoke) {
          isReadingKaraoke = false;
          return;
        }
        const cur = steps[idx];
        cur.elIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.add('karaoke-active');
        });
        idx++;
        speakText(cur.text, () => setTimeout(playNext, 120));
      }
      playNext();
    }

    function clearKaraokeHighlights() {
      document.querySelectorAll('.karaoke-active').forEach(el => el.classList.remove('karaoke-active'));
    }

    function enterSentencePatternTraining(patternId) {
      playSound('place');
      activePatternId = patternId;
      currentQuestionIndex = 0;
      currentScreen = 'training';
      document.getElementById('homeScreen').classList.add('hidden');
      document.getElementById('trainingScreen').classList.remove('hidden');
      loadQuestion(0);
    }

    function switchActivePatternQuick() {
      playSound('pop');
      enterSentencePatternTraining(activePatternId === 'because_therefore' ? 'sequence_4step' : 'because_therefore');
    }

    function goToHomeScreen() {
      playSound('pop');
      if (autoCheckTimer) clearTimeout(autoCheckTimer);
      window.speechSynthesis && window.speechSynthesis.cancel();
      clearKaraokeHighlights();
      isReadingKaraoke = false;
      currentScreen = 'home';
      document.getElementById('trainingScreen').classList.add('hidden');
      document.getElementById('homeScreen').classList.remove('hidden');
      renderHomeScreen();
    }

    function loadQuestion(index) {
      if (autoCheckTimer) clearTimeout(autoCheckTimer);
      const qList = getActiveQuestionList();
      if (!qList.length) return;
      if (index < 0) index = qList.length - 1;
      if (index >= qList.length) index = 0;
      currentQuestionIndex = index;

      clearKaraokeHighlights();
      isReadingKaraoke = false;
      targetSlotKey = null;
      isCurrentQuestionSolved = false;
      lockedCorrectSlots.clear();
      hideActionOverlay();

      updateProgressTopBar();
      const q = qList[currentQuestionIndex];

      if (activePatternId === 'sequence_4step') {
        slots = { step1: null, step2: null, step3: null, step4: null };
        const cards = q.steps.map((st, idx) => ({
          id: `card-step-${idx + 1}`,
          role: `step${idx + 1}`,
          stepNumber: idx + 1,
          isConjunction: false,
          cantonese: st.cantonese,
          written: st.written,
          img: st.img,
          sceneKey: st.sceneKey
        }));

        if (difficulty === 1) {
          slots.step1 = cards[0];
          slots.step4 = cards[3];
          lockedCorrectSlots.add('step1');
          lockedCorrectSlots.add('step4');
        }
        trayCards = shuffleArray(cards);
        if (trayCards.every((c, i) => c.stepNumber === i + 1)) trayCards.reverse();
      } else {
        slots = { cause: null, effect: null };
        const cards = [
          { id: 'card-cause', role: 'cause', isConjunction: false, cantonese: q.cause.cantonese, written: q.cause.written, img: q.cause.img, sceneKey: q.cause.sceneKey },
          { id: 'card-effect', role: 'effect', isConjunction: false, cantonese: q.effect.cantonese, written: q.effect.written, img: q.effect.img, sceneKey: q.effect.sceneKey }
        ];
        if (difficulty >= 2 && q.distractors) {
          q.distractors.slice(0, 2).forEach((d, idx) => {
            cards.push({ id: `card-dist-${idx}`, role: 'distractor', isConjunction: false, cantonese: d.cantonese, written: d.written || d.cantonese, img: d.img, sceneKey: d.sceneKey });
          });
        }
        trayCards = shuffleArray(cards);
      }

      renderWorkspace();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

      const starEl = document.getElementById('teacherStarCount');

      if (homeStarEl) homeStarEl.textContent = starCount;

      container.className = 'grid grid-cols-2 gap-2.5 sm:gap-5 h-full items-stretch';
      container.innerHTML = `
        <div class="bg-orange-50/90 rounded-3xl p-2 sm:p-3.5 border-3 border-orange-200 flex flex-col sm:flex-row items-center gap-2 sm:gap-3.5 h-full">
          <button onclick="speakText('因為')" class="tactile-btn bg-orange-500 hover:bg-orange-400 text-white border-2 border-orange-300 rounded-2xl px-3.5 py-1.5 sm:px-5 sm:py-5 flex items-center justify-center shadow shrink-0">

    /********************************************************************
     * 6. 觸控與拖放邏輯
     ********************************************************************/
    function handleCardPointerDown(e, card) {
      if (e.button && e.button !== 0) return;
      pointerDragState = { active: true, cardId: card.id, startX: e.clientX, startY: e.clientY, moved: false, hoveredSlotKey: null };
    }

    function setupGlobalPointerListeners() {
      window.addEventListener('pointermove', (e) => {
        if (!pointerDragState.active) return;
        const dx = e.clientX - pointerDragState.startX;
        const dy = e.clientY - pointerDragState.startY;
        if (!pointerDragState.moved && Math.hypot(dx, dy) > 10) {
          pointerDragState.moved = true;
          const card = trayCards.find(c => c.id === pointerDragState.cardId);
          if (card) { playSound('pop'); showTouchDragGhost(card, e.clientX, e.clientY); }
        }
        if (pointerDragState.moved) {
          moveTouchDragGhost(e.clientX, e.clientY);
          highlightSlotUnderPointer(e.clientX, e.clientY);
        }
      }, { passive: true });

      window.addEventListener('pointerup', () => {
        if (!pointerDragState.active) return;
        const { cardId, moved, hoveredSlotKey } = pointerDragState;
        pointerDragState.active = false;
        hideTouchDragGhost();
        clearSlotHoverHighlights();
        const card = trayCards.find(c => c.id === cardId);
        if (!card) return;
        if (moved && hoveredSlotKey && !lockedCorrectSlots.has(hoveredSlotKey)) placeCardIntoSlot(card, hoveredSlotKey);
        else if (!moved) handleCardDirectTap(card);
      });
    }

    function handleCardDirectTap(card) {
      let destSlot = null;
      if (targetSlotKey && !slots[targetSlotKey] && !lockedCorrectSlots.has(targetSlotKey)) destSlot = targetSlotKey;
      else if (activePatternId === 'sequence_4step') {
        for (let i = 1; i <= 4; i++) { if (!slots[`step${i}`]) { destSlot = `step${i}`; break; } }
      } else {
        if (!slots.cause) destSlot = 'cause';
        else if (!slots.effect) destSlot = 'effect';
      }
      if (destSlot) placeCardIntoSlot(card, destSlot);
      else { playSound('pop'); speakText(getCardSpokenText(card)); }
    }

    function placeCardIntoSlot(card, slotKey) {
      if (lockedCorrectSlots.has(slotKey)) return;
      hideActionOverlay();
      slots[slotKey] = card;
      targetSlotKey = null;
      playSound('place');
      speakText(getCardSpokenText(card));
      renderWorkspace();
      scheduleAutoCheckIfFull();
    }

    function handleSlotTap(slotKey) {
      if (isCurrentQuestionSolved || lockedCorrectSlots.has(slotKey)) {
        if (slots[slotKey]) speakText(getCardSpokenText(slots[slotKey]));
        return;
      }
      hideActionOverlay();
      if (slots[slotKey]) {
        slots[slotKey] = null;
        targetSlotKey = null;
        playSound('return');
        renderWorkspace();
      } else {
        playSound('pop');
        targetSlotKey = (targetSlotKey === slotKey) ? null : slotKey;
        renderWorkspace();
      }
    }

    function showTouchDragGhost(card, x, y) {
      const ghost = document.getElementById('touchDragGhost');
      if (!ghost) return;
      const displayText = getCardDisplayText(card);
      ghost.innerHTML = `
        <div class="w-full h-full rounded-2xl p-1.5 bg-white border-4 border-amber-400 shadow-2xl flex flex-col justify-between overflow-hidden">
          <div class="w-full ${displayText ? 'h-[78%]' : 'h-full'} rounded-xl overflow-hidden bg-slate-100">${renderCardVisual(card)}</div>
          ${displayText ? `<div class="text-xs font-black text-slate-800 text-center truncate px-1">${displayText}</div>` : ''}
        </div>
      `;
      ghost.style.left = `${x}px`; ghost.style.top = `${y}px`;
      ghost.classList.remove('hidden');
    }

    function moveTouchDragGhost(x, y) {
      const ghost = document.getElementById('touchDragGhost');
      if (ghost) { ghost.style.left = `${x}px`; ghost.style.top = `${y}px`; }
    }

    function hideTouchDragGhost() {
      const ghost = document.getElementById('touchDragGhost');
      if (ghost) ghost.classList.add('hidden');
    }

    function highlightSlotUnderPointer(x, y) {
      clearSlotHoverHighlights();
      const elUnder = document.elementFromPoint(x, y);
      const slotContainer = elUnder ? elUnder.closest('[data-slot-key]') : null;
      if (slotContainer && !lockedCorrectSlots.has(slotContainer.dataset.slotKey)) {
        pointerDragState.hoveredSlotKey = slotContainer.dataset.slotKey;
        slotContainer.classList.add('slot-hover-target');
      } else pointerDragState.hoveredSlotKey = null;
    }

    function clearSlotHoverHighlights() {
      document.querySelectorAll('[data-slot-key]').forEach(el => el.classList.remove('slot-hover-target'));
    }

    /********************************************************************
     * 7. 自動批改與獎勵
     ********************************************************************/
    function scheduleAutoCheckIfFull() {
      if (autoCheckTimer) clearTimeout(autoCheckTimer);
      if (activePatternId === 'sequence_4step') {
        if (slots.step1 && slots.step2 && slots.step3 && slots.step4) autoCheckTimer = setTimeout(evaluateFourStepSequence, 420);
      } else {
        if (slots.cause && slots.effect) autoCheckTimer = setTimeout(evaluateCausalAnswer, 420);
      }
    }

    function evaluateFourStepSequence() {
      const keys = ['step1', 'step2', 'step3', 'step4'];
      const wrongKeys = [];
      keys.forEach((k, idx) => {
        if (slots[k] && slots[k].stepNumber === idx + 1) lockedCorrectSlots.add(k);
        else wrongKeys.push(k);
      });
      renderWorkspace();

      if (wrongKeys.length === 0) {
        isCurrentQuestionSolved = true;
        playSound('success');
        launchConfetti();
        addStarReward();
        showNextQuestionButton();
        setTimeout(() => speakCurrentSentence(false), 300);
        return;
      }

      playSound('gentleHint');
      wrongKeys.forEach(k => {
        const el = document.getElementById(`slot-${k}`);
        if (el) { el.classList.add('shake-feedback'); setTimeout(() => el.classList.remove('shake-feedback'), 600); }
      });
      speakText('試下調轉錯咗嘅圖卡啦！');
      const bar = document.getElementById('actionOverlayBar');
      const content = document.getElementById('actionOverlayContent');
      bar.classList.remove('hidden');
      content.innerHTML = `
        <button onclick="returnWrongSequenceCards()" class="tactile-btn bg-amber-500 hover:bg-amber-400 text-white border-3 border-white px-4 sm:px-6 py-2 rounded-full font-black text-sm sm:text-lg shadow-xl flex items-center gap-1.5 animate-pop"><span>↩️</span><span>重排錯嘅卡</span></button>
        <button onclick="autoFixSequenceCards()" class="tactile-btn bg-orange-500 hover:bg-orange-400 text-white border-3 border-white px-4 sm:px-6 py-2 rounded-full font-black text-sm sm:text-lg shadow-xl flex items-center gap-1.5 animate-pop"><span>🔄</span><span>幫手調啱位置</span></button>
      `;
    }

    function returnWrongSequenceCards() {
      playSound('return');
      ['step1', 'step2', 'step3', 'step4'].forEach(k => { if (!lockedCorrectSlots.has(k)) slots[k] = null; });
      hideActionOverlay();
      renderWorkspace();
    }

    function autoFixSequenceCards() {
      playSound('place');
      ['step1', 'step2', 'step3', 'step4'].forEach((k, idx) => {
        const rightCard = trayCards.find(c => c.stepNumber === idx + 1);
        if (rightCard) slots[k] = rightCard;
      });
      hideActionOverlay();
      renderWorkspace();
      scheduleAutoCheckIfFull();
    }

    function evaluateCausalAnswer() {
      const isCauseOk = slots.cause && slots.cause.role === 'cause';
      const isEffectOk = slots.effect && slots.effect.role === 'effect';
      if (isCauseOk && isEffectOk) {
        isCurrentQuestionSolved = true;
        playSound('success');
        launchConfetti();
        addStarReward();
        showNextQuestionButton();
        setTimeout(() => speakCurrentSentence(false), 300);
        return;
      }
      if (slots.cause && slots.effect && slots.cause.role === 'effect' && slots.effect.role === 'cause') {
        playSound('gentleHint');
        speakText('諗下邊樣發生先？試下調轉佢哋啦！');
        const bar = document.getElementById('actionOverlayBar');
        const content = document.getElementById('actionOverlayContent');
        bar.classList.remove('hidden');
        content.innerHTML = `<button onclick="swapCausalCards()" class="tactile-btn bg-orange-500 hover:bg-orange-400 text-white border-4 border-white px-7 py-2.5 rounded-full font-black text-base sm:text-xl shadow-xl flex items-center gap-2 animate-pop"><span>🔄</span><span>調轉圖卡</span></button>`;
        return;
      }
      playSound('gentleHint');
      speakText('唔係呢張喎，再試一次啦！');
      setTimeout(() => {
        if (!isCauseOk) slots.cause = null;
        if (!isEffectOk) slots.effect = null;
        renderWorkspace();
      }, 600);
    }

    function swapCausalCards() {
      playSound('place');
      const tmp = slots.cause; slots.cause = slots.effect; slots.effect = tmp;
      hideActionOverlay(); renderWorkspace(); scheduleAutoCheckIfFull();
    }

    function showNextQuestionButton() {
      const bar = document.getElementById('actionOverlayBar');
      const content = document.getElementById('actionOverlayContent');
      bar.classList.remove('hidden');
      content.innerHTML = `<button onclick="nextQuestion()" class="tactile-btn bg-emerald-500 hover:bg-emerald-400 text-white border-4 border-white px-7 py-2.5 rounded-full font-black text-lg sm:text-2xl shadow-xl flex items-center gap-2.5 animate-bounce"><span>下一題</span><span>➡️</span></button>`;
    }

    function hideActionOverlay() {
      const bar = document.getElementById('actionOverlayBar');
      if (bar) bar.classList.add('hidden');
    }

    function addStarReward() {
      starCount++;
      localStorage.setItem('sen_causal_stars', String(starCount));
      const q = getActiveQuestionList()[currentQuestionIndex];
      if (q && q.id) {
        completedQuestionIds.add(q.id);
        try { localStorage.setItem('sen_completed_qids_v2', JSON.stringify([...completedQuestionIds])); } catch (e) {}
      }
      updateProgressTopBar();
    }

    function prevQuestion() { playSound('pop'); loadQuestion(currentQuestionIndex - 1); }
    function nextQuestion() { playSound('pop'); loadQuestion(currentQuestionIndex + 1); }
    function jumpToQuestion(idxStr) {
      const idx = parseInt(idxStr, 10);
      if (!isNaN(idx)) { closeTeacherModal(); loadQuestion(idx); }
    }

    function openTeacherModal() { playSound('pop'); updateTeacherControlsUI(); document.getElementById('teacherModal').classList.remove('hidden'); }
    function closeTeacherModal() { document.getElementById('teacherModal').classList.add('hidden'); }
    function selectPatternFromModal(patId) { closeTeacherModal(); enterSentencePatternTraining(patId); }
    function setDifficulty(lvl) { playSound('pop'); difficulty = lvl; updateTeacherControlsUI(); if (currentScreen === 'training') loadQuestion(currentQuestionIndex); }
    function setTextMode(mode) { playSound('pop'); textMode = mode; updateTeacherControlsUI(); if (currentScreen === 'training') renderWorkspace(); else renderHomeScreen(); }
    function toggleVoiceLang() {
      playSound('pop'); voiceLang = voiceLang === 'zh-HK' ? 'zh-CN' : 'zh-HK';
      document.getElementById('voiceLangBtn').textContent = voiceLang === 'zh-HK' ? '🔊 粵語發音' : '🔊 普通話發音';
    }
    function toggleVoiceSpeed() {
      playSound('pop'); voiceRate = voiceRate === 0.85 ? 1.0 : 0.85;
      document.getElementById('voiceSpeedBtn').textContent = voiceRate === 0.85 ? '🐢 慢速朗讀' : '🐇 正常語速';
    }

    function updateTeacherControlsUI() {
      const select = document.getElementById('questionSelect');
      if (select) {
        select.innerHTML = '';
        getActiveQuestionList().forEach((q, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = activePatternId === 'sequence_4step'
            ? `${idx + 1}. 【${q.title || '四步次序'}】${q.steps[0].cantonese} ➔ ...`
            : `${idx + 1}. 因為「${q.cause.cantonese}」➔ 所以「${q.effect.cantonese}」`;
          select.appendChild(opt);
        });
        select.value = currentQuestionIndex;
      }
      [1, 2, 3].forEach(lvl => {
        const el = document.getElementById(`diffBtn${lvl}`);
        if (el) el.className = difficulty === lvl ? 'py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2 bg-amber-400 text-slate-900 border-amber-500' : 'py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2 bg-white text-slate-600 border-slate-200';
      });
      [{ id: 'tmBtnCantonese', m: 'cantonese' }, { id: 'tmBtnWritten', m: 'written' }, { id: 'tmBtnNone', m: 'none' }].forEach(item => {
        const el = document.getElementById(item.id);
        if (el) el.className = textMode === item.m ? 'py-2 px-1.5 rounded-xl font-black text-xs border-2 bg-emerald-500 text-white border-emerald-600' : 'py-2 px-1.5 rounded-xl font-black text-xs border-2 bg-white text-slate-600 border-slate-200';
      });
      updateProgressTopBar();
    }

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const colors = ['#F97316', '#0EA5E9', '#10B981', '#FACC15', '#EC4899'];
      const particles = Array.from({ length: 45 }, () => ({
        x: canvas.width / 2, y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 13 - 4,
        size: Math.random() * 8 + 5, color: colors[Math.floor(Math.random() * colors.length)]
      }));
      let frame = 0;
      function animate() {
        frame++; ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.42; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
        if (frame < 65) requestAnimationFrame(animate); else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(animate);
    }

    window.onload = initApp;
  </script>
