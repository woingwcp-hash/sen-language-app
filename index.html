<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>互動句式語言訓練百寶箱 (因為所以・首先跟住然後最後)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #FFFBEB 0%, #FEF3C7 50%, #E0F2FE 100%);
    }

    .tactile-btn {
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
      box-shadow: 0 5px 0 rgba(15, 23, 42, 0.15);
      touch-action: manipulation;
    }
    .tactile-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.15);
    }

    .pattern-menu-card {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 0 rgba(15, 23, 42, 0.1), 0 14px 28px rgba(15, 23, 42, 0.08);
      touch-action: manipulation;
    }
    .pattern-menu-card:active {
      transform: translateY(4px) scale(0.985);
      box-shadow: 0 3px 0 rgba(15, 23, 42, 0.1);
    }

    .storybook-card {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 7px 0 rgba(15, 23, 42, 0.1), 0 10px 20px rgba(15, 23, 42, 0.07);
      touch-action: none;
    }
    .storybook-card:active {
      transform: scale(0.97);
    }

    @keyframes slot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .slot-targeted {
      animation: slot-pulse 1s ease-in-out infinite;
      box-shadow: 0 0 0 5px #FBBF24 !important;
      background-color: #FFFBEB !important;
    }

    .slot-hover-target {
      transform: scale(1.03) !important;
      box-shadow: 0 0 0 5px #F59E0B !important;
      background-color: #FEF3C7 !important;
    }

    @keyframes karaoke-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1.02); }
    }
    .karaoke-active {
      transform: scale(1.03) !important;
      box-shadow: 0 0 0 7px #FACC15, 0 12px 24px rgba(250, 204, 21, 0.45) !important;
      z-index: 30;
      animation: karaoke-pop 0.35s ease-out forwards;
    }

    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px) rotate(-1.5deg); }
      40% { transform: translateX(9px) rotate(1.5deg); }
      60% { transform: translateX(-6px) rotate(-1deg); }
      80% { transform: translateX(6px) rotate(1deg); }
    }
    .shake-feedback {
      animation: gentle-shake 0.55s ease-in-out;
    }

    @keyframes pop-in {
      0% { transform: scale(0.9); opacity: 0; }
      70% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: pop-in 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
  </style>
</head>
<body class="w-full h-full flex flex-col justify-between overflow-hidden select-none">

  <!-- Confetti Canvas Overlay -->
  <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- Floating Drag Ghost Container for Touch Pointer Dragging -->
  <div id="touchDragGhost" class="fixed pointer-events-none z-50 hidden" style="width: 175px; height: 165px; transform: translate(-50%, -50%) rotate(2deg);"></div>

  <!-- ===================================================================
       VIEW 1: 🏠 句式練習主頁 (HOME MENU SCREEN)
       =================================================================== -->
  <div id="homeScreen" class="w-full h-full flex flex-col justify-between px-3.5 sm:px-8 py-3 sm:py-5 max-w-6xl mx-auto">
    
    <!-- Top Header -->
    <header class="shrink-0 flex items-center justify-between gap-2 pb-1">
      <div class="flex items-center gap-2.5 sm:gap-3.5">
        <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-2xl bg-amber-400 border-3 border-amber-500 shadow flex items-center justify-center text-2xl sm:text-3xl">
          🗣️
        </div>
        <div>
          <h1 class="text-xl sm:text-3xl font-black text-slate-800 tracking-tight">句式練習百寶箱</h1>
          <p class="text-xs sm:text-sm font-bold text-slate-500">撳一下句式大圖卡開始練習</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="bg-white/95 border-2 border-amber-300 rounded-full px-3.5 sm:px-5 py-1.5 flex items-center gap-1.5 shadow-sm">
          <span class="text-lg sm:text-2xl">⭐</span>
          <span id="homeStarCount" class="text-base sm:text-xl font-black text-slate-800">0</span>
        </div>

        <button onclick="openTeacherModal()" aria-label="家長及老師設定" class="tactile-btn w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-white/90 hover:bg-white text-slate-600 border-2 border-slate-300 flex items-center justify-center text-xl">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Main Sentence Pattern Cards Grid -->
    <main class="flex-1 min-h-0 flex items-center justify-center py-1.5 sm:py-3 overflow-y-auto thin-scroll">
      <div id="patternMenuGrid" class="w-full h-full max-h-[580px] grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-stretch">
        <!-- Populated by renderHomeScreen() -->
      </div>
    </main>

    <!-- Bottom Voice Prompt Banner -->
    <footer class="shrink-0 pt-1 text-center">
      <div class="inline-flex items-center gap-2 bg-white/85 border-2 border-amber-200 px-4 py-1.5 rounded-full text-xs sm:text-sm font-black text-slate-600 shadow-sm">
        <span>👆</span>
        <span id="homeHintText">請選擇「因為…所以…」或者「首先…跟住…然後…最後…」開始練習！</span>
      </div>
    </footer>
  </div>

  <!-- ===================================================================
       VIEW 2: 🎯 句式互動訓練畫面 (SUPPORTS BOTH 2-SLOT & 4-SLOT MODES)
       =================================================================== -->
  <div id="trainingScreen" class="hidden w-full h-full flex flex-col justify-between overflow-hidden">
    
    <!-- Minimalist Training Top Bar -->
    <header class="shrink-0 px-2.5 sm:px-6 pt-2 pb-1 flex items-center justify-between z-20 max-w-6xl w-full mx-auto gap-1.5">
      
      <!-- Left: Home Button + Quick Pattern Switcher + Question Navigation -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="goToHomeScreen()" aria-label="返回主頁" class="tactile-btn bg-white hover:bg-amber-50 text-slate-800 border-2 border-amber-300 px-2.5 sm:px-3.5 h-10 sm:h-11 rounded-full flex items-center gap-1 font-black text-xs sm:text-base">
          <span class="text-base sm:text-lg">🏠</span>
          <span class="hidden sm:inline">主頁</span>
        </button>

        <!-- Quick Switch Badge between the 2 Active Patterns -->
        <button id="activePatternBadgeBtn" onclick="switchActivePatternQuick()" class="tactile-btn bg-amber-100 hover:bg-amber-200 text-amber-950 border-2 border-amber-300 px-2.5 sm:px-3.5 h-10 sm:h-11 rounded-full flex items-center gap-1 font-black text-xs sm:text-sm">
          <span id="activePatternBadgeText">因為…所以…</span>
          <span class="text-[10px] opacity-70">🔄</span>
        </button>

        <button onclick="prevQuestion()" aria-label="上一題" class="tactile-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-white hover:bg-amber-50 text-slate-700 border-2 border-amber-300 flex items-center justify-center font-black text-sm sm:text-lg">
          ◀
        </button>

        <div class="bg-white/95 border-2 border-amber-300 rounded-full px-2.5 sm:px-3.5 py-1 flex items-center gap-1 shadow-sm">
          <span class="text-sm sm:text-lg">⭐</span>
          <span id="progressText" class="text-xs sm:text-lg font-black text-slate-800">1 / 8</span>
        </div>

        <button onclick="nextQuestion()" aria-label="下一題" class="tactile-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-white hover:bg-amber-50 text-slate-700 border-2 border-amber-300 flex items-center justify-center font-black text-sm sm:text-lg">
          ▶
        </button>
      </div>

      <!-- Right: AI Generation Progress/Redraw Button + Big Clear "🔊 讀句子" Button + Subtle "⚙️" Teacher Settings Button -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="topAiStatusBtn" onclick="ensureCurrentQuestionAIImages(true)" class="hidden">
       <span id="topAiStatusIcon" class="text-sm sm:text-base">🎨</span>
       <span id="topAiStatusText">重繪AI圖</span>
     </button>

        <button onclick="speakCurrentSentence(true)" class="tactile-btn bg-amber-400 hover:bg-amber-300 text-slate-900 border-2 border-amber-500 px-3 sm:px-5 h-10 sm:h-11 rounded-full font-black text-xs sm:text-lg flex items-center gap-1 sm:gap-1.5">
          <span class="text-base sm:text-xl">🔊</span>
          <span>讀句子</span>
        </button>

        <button onclick="openTeacherModal()" aria-label="家長及老師設定" class="tactile-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/90 hover:bg-white text-slate-600 border-2 border-slate-300 flex items-center justify-center text-base sm:text-lg">
          ⚙️
        </button>
      </div>

    </header>

    <!-- Main Workspace (90% Screen Space: Top Sentence Zone + Bottom Big Cards) -->
    <main class="flex-1 min-h-0 px-2.5 sm:px-6 pb-2.5 sm:pb-4 pt-1 flex flex-col justify-between gap-2 sm:gap-3.5 max-w-6xl w-full mx-auto">

      <!-- TOP HALF: Sentence Dropzone (Dynamically adapts for 2-slot or 4-slot sequence) -->
      <section class="flex-1 min-h-0 bg-white/90 rounded-[1.75rem] sm:rounded-[2rem] p-2 sm:p-3.5 border-4 border-amber-200 shadow-sm flex flex-col justify-center relative">
        
        <div id="topSlotsContainer" class="w-full h-full">
          <!-- Dynamically populated by renderWorkspace() -->
        </div>

        <!-- Floating Action Overlay Pill (Appears when Reversed 🔄, Partially Correct, or Solved ➡️) -->
        <div id="actionOverlayBar" class="hidden absolute inset-x-0 -bottom-3.5 sm:-bottom-4 flex justify-center z-30 pointer-events-none">
          <div id="actionOverlayContent" class="pointer-events-auto flex items-center gap-2"></div>
        </div>

      </section>

      <!-- BOTTOM HALF: Distraction-Free Picture Card Tray -->
      <section class="flex-1 min-h-0 bg-white/85 rounded-[1.75rem] sm:rounded-[2rem] p-2 sm:p-3.5 border-4 border-amber-200/90 shadow-sm flex flex-col justify-center">
        <div id="cardTray" class="w-full h-full">
          <!-- Populated dynamically with large 82% picture + 18% text cards -->
        </div>
      </section>

    </main>

  </div>

  <!-- ===================================================================
       3. ⚙️ 老師／家長設定面板 (Modal Drawer)
       =================================================================== -->
  <div id="teacherModal" onclick="if(event.target === this) closeTeacherModal()" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-5">
    <div class="bg-white rounded-[2rem] max-w-2xl w-full max-h-[90dvh] overflow-y-auto thin-scroll border-4 border-slate-300 shadow-2xl p-4 sm:p-6 space-y-4 animate-pop">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b-2 border-slate-100 pb-3">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">⚙️</span>
          <div>
            <h2 class="text-lg sm:text-xl font-black text-slate-800">家長／言語治療師設定面板</h2>
            <p class="text-xs font-bold text-slate-500">切換句式、調整難度、語音及使用 AI 生成新圖卡（已獲 ⭐ <span id="teacherStarCount">0</span> 粒星）</p>
          </div>
        </div>
        <button onclick="closeTeacherModal()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-lg flex items-center justify-center">✕</button>
      </div>

      <!-- 0. 快速切換句式模式 -->
      <div class="bg-amber-50 p-3.5 rounded-2xl border-2 border-amber-200 space-y-2">
        <div class="text-xs sm:text-sm font-black text-amber-950">🗣️ 選擇練習句式：</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <button type="button" id="modalPatCausalBtn" onclick="selectPatternFromModal('because_therefore')" class="py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 text-left flex items-center justify-between">
            <span>1️⃣ 因為 … 所以 … (因果2格)</span>
            <span>▶️</span>
          </button>
          <button type="button" id="modalPatSeqBtn" onclick="selectPatternFromModal('sequence_4step')" class="py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 text-left flex items-center justify-between">
            <span>2️⃣ 首先…跟住…然後…最後… (次序4格)</span>
            <span>▶️</span>
          </button>
        </div>
      </div>

      <!-- 1. 題目快速選擇 -->
      <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
        <label class="block text-xs sm:text-sm font-black text-slate-700">📚 選擇當前句式練習題目：</label>
        <select id="questionSelect" onchange="jumpToQuestion(this.value)" class="w-full bg-white border-2 border-amber-300 text-slate-800 font-black rounded-xl px-3 py-2 text-sm focus:outline-none">
        </select>
      </div>

      <!-- 2. 難度切換 (初階 / 中階 / 高階) -->
      <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
        <div class="text-xs sm:text-sm font-black text-slate-700">🎯 訓練難度階段：</div>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="setDifficulty(1)" id="diffBtn1" class="py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2 transition-all">
            🌱 初階 (基礎輔助)
          </button>
          <button type="button" onclick="setDifficulty(2)" id="diffBtn2" class="py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2 transition-all">
            🌿 中階 (進階挑戰)
          </button>
          <button type="button" onclick="setDifficulty(3)" id="diffBtn3" class="py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2 transition-all">
            🌳 高階 (完整重組)
          </button>
        </div>
        <p id="diffDescText" class="text-[11px] font-bold text-slate-500"></p>
      </div>

      <!-- 3. 文字顯示模式 & 語音設定 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
          <div class="text-xs sm:text-sm font-black text-slate-700">💬 圖卡文字顯示模式：</div>
          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" onclick="setTextMode('cantonese')" id="tmBtnCantonese" class="py-2 px-1.5 rounded-xl font-black text-xs border-2">
              廣東話口語
            </button>
            <button type="button" onclick="setTextMode('written')" id="tmBtnWritten" class="py-2 px-1.5 rounded-xl font-black text-xs border-2">
              標準書面語
            </button>
            <button type="button" onclick="setTextMode('none')" id="tmBtnNone" class="py-2 px-1.5 rounded-xl font-black text-xs border-2">
              🖼️ 純圖卡
            </button>
          </div>
        </div>

        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
          <div class="text-xs sm:text-sm font-black text-slate-700">🔊 語音與語速設定：</div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="toggleVoiceLang()" id="voiceLangBtn" class="flex-1 py-2 px-3 rounded-xl font-black text-xs bg-purple-100 text-purple-900 border-2 border-purple-300">
              🔊 粵語發音
            </button>
            <button type="button" onclick="toggleVoiceSpeed()" id="voiceSpeedBtn" class="flex-1 py-2 px-3 rounded-xl font-black text-xs bg-amber-100 text-amber-900 border-2 border-amber-300">
              🐢 慢速朗讀
            </button>
          </div>
        </div>
      </div>

      <!-- 4. 🎨 AI 圖卡畫風與重新生成 -->
      <div class="bg-fuchsia-50/80 p-3.5 rounded-2xl border-2 border-fuchsia-200 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <div class="text-xs sm:text-sm font-black text-fuchsia-950">🎨 AI 插畫風格與重繪</div>
            <div id="aiTeacherStatus" class="text-[11px] font-bold text-fuchsia-700">內置高清繪本圖卡，亦可一鍵呼叫 AI 生成插畫</div>
          </div>
          <button type="button" onclick="regenerateCurrentQuestionImages()" class="tactile-btn bg-fuchsia-600 hover:bg-fuchsia-500 text-white px-3.5 py-1.5 rounded-xl font-black text-xs flex items-center gap-1">
            <span>🔄</span><span>AI 生成本題插畫</span>
          </button>
        </div>

        <div id="styleOptionsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
      </div>

      <!-- 5. ✨ AI 智能新增自訂題目 (支援「因為…所以…」及「首先…跟住…然後…最後…」) -->
      <div class="bg-indigo-50/80 p-3.5 rounded-2xl border-2 border-indigo-200 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="text-xs sm:text-sm font-black text-indigo-950">✨ AI 智能新增自訂題目（自動生成文字＋AI圖卡）：</div>
          <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-indigo-200">
            <button type="button" id="aiGenModeCausalBtn" onclick="setAiWorkshopPattern('because_therefore')" class="px-2.5 py-1 rounded-lg text-xs font-black transition-all">因為…所以…</button>
            <button type="button" id="aiGenModeSeqBtn" onclick="setAiWorkshopPattern('sequence_4step')" class="px-2.5 py-1 rounded-lg text-xs font-black transition-all">首先…跟住…然後…最後…</button>
          </div>
        </div>
        
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="fillTopicChip('自己着鞋襪出門口')" class="px-2.5 py-1 rounded-full bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 text-xs font-bold">👟 着鞋襪出門</button>
          <button type="button" onclick="fillTopicChip('沖涼洗白白步驟')" class="px-2.5 py-1 rounded-full bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 text-xs font-bold">🛁 沖涼四部曲</button>
          <button type="button" onclick="fillTopicChip('唔肯刷牙食太多糖')" class="px-2.5 py-1 rounded-full bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 text-xs font-bold">🦷 唔肯刷牙</button>
          <button type="button" onclick="fillTopicChip('借圖書同睇書習慣')" class="px-2.5 py-1 rounded-full bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 text-xs font-bold">📖 睇圖書</button>
        </div>

        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="aiTopicInput" placeholder="輸入日常主題（例如：沖涼步驟、借圖書、唔肯刷牙）..." class="flex-1 px-3.5 py-2 rounded-xl border-2 border-indigo-300 text-sm font-bold bg-white focus:outline-none" />
          <button type="button" id="aiGenerateTopicBtn" onclick="handleGenerateFromTopic()" class="tactile-btn bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black text-xs sm:text-sm shrink-0">
            ✨ AI 生成新題目
          </button>
        </div>

        <div id="workshopStatusBox" class="hidden rounded-xl p-2.5 bg-white border border-indigo-200 text-indigo-900 text-xs font-bold flex items-center gap-2">
          <div class="w-4 h-4 rounded-full border-2 border-indigo-600 border-t-transparent animate-spin shrink-0"></div>
          <div id="workshopStatusText">正在生成...</div>
        </div>
      </div>

      <!-- 6. 主頁顯示未來預告句式開關 -->
      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between gap-2">
        <span class="text-xs font-black text-slate-600">🏠 主頁顯示未開放預告句式（「如果…就…」、「雖然…但是…」）</span>
        <button type="button" id="showFutureToggleBtn" onclick="toggleShowFuturePatterns()" class="px-3 py-1.5 rounded-xl font-black text-xs border-2">
          已隱藏
        </button>
      </div>

      <button type="button" onclick="closeTeacherModal()" class="tactile-btn w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-2xl font-black text-base">
        完成設定並返回
      </button>

    </div>
  </div>

  <script>
    /********************************************************************
     * 1. RICH PARAMETERIZED STORYBOOK SVG ILLUSTRATION ENGINE
     ********************************************************************/
    function renderCuteSceneSVG(sceneKey) {
      const map = {
        rain_cause:   ['#475569', '#334155', '#FB7185', 'surprised', 'rain_window'],

    function openImageDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open('sen_dual_patterns_ai_db_v2', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('ai_images')) db.createObjectStore('ai_images');
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      });
    }

    async function getCachedAIImage(cacheKey) {
      if (memoryImageCache.has(cacheKey)) return memoryImageCache.get(cacheKey);
      const db = await openImageDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const req = db.transaction('ai_images', 'readonly').objectStore('ai_images').get(cacheKey);
          req.onsuccess = () => {
            if (req.result) memoryImageCache.set(cacheKey, req.result);
            resolve(req.result || null);
          };
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }

    async function setCachedAIImage(cacheKey, dataUrl) {
      memoryImageCache.set(cacheKey, dataUrl);
      const db = await openImageDB();
      if (!db) return;
      try {
        db.transaction('ai_images', 'readwrite').objectStore('ai_images').put(dataUrl, cacheKey);
      } catch (e) {}
    }

    async function fetchWithRetry(url, options, maxRetries = 2) {
      let delay = 800;
      for (let i = 0; i <= maxRetries; i++) {
        try {
          const res = await fetch(url, options);
          if (res.ok) return await res.json();
          if (i === maxRetries) throw new Error(`HTTP ${res.status}`);
        } catch (err) {
          if (i === maxRetries) throw err;
        }
        await new Promise(r => setTimeout(r, delay));
        delay *= 2;
      }
    }

    async function generateAIImageFromPrompt(visualPrompt, styleKey = currentArtStyle) {
      const styleObj = AI_ART_STYLES[styleKey] || AI_ART_STYLES['3d_pixar'];
      const fullPrompt = [
        styleObj.promptPrefix,
        visualPrompt,
        ". CRITICAL MANDATORY RULES:",
        "1. SINGLE UNIFIED SCENE ONLY. Strictly NO split-screen, NO multi-panel, NO 3-panel triptych, NO comic strip frames, NO collage.",
        "2. ONLY THE SINGLE CHILD CHARACTER IN FRAME. Strictly NO adult hands reaching in, NO multiple extra people.",
        "3. PURE ARTWORK ONLY. Strictly NO text, NO numbers, NO subtitles."
      ].join(" ");

      const generateContentModels = [
        'gemini-3.1-flash-lite-image',
        'gemini-3.1-flash-image',
        'gemini-2.5-flash-image-preview',
        'gemini-2.0-flash-preview-image-generation'
      ];

      for (const m of generateContentModels) {
        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`;
          const result = await fetchWithRetry(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: fullPrompt }] }],
              generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
            })
          }, 1);
          const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData && p.inlineData.data);
          if (part) {
            return `data:${part.inlineData.mimeType || 'image/png'};base64,${part.inlineData.data}`;
          }
        } catch (e) {}
      }

      try {
        const imagenUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`;
        const imagenRes = await fetchWithRetry(imagenUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            instances: [{ prompt: fullPrompt }],
            parameters: { sampleCount: 1, aspectRatio: '4:3' }
          })
        }, 1);
        const b64 = imagenRes?.predictions?.[0]?.bytesBase64Encoded;
        if (b64) {
          return `data:image/png;base64,${b64}`;
        }
      } catch (e) {}

      return null;
    }

    async function ensureCurrentQuestionAIImages(forceRegenerate = false) {
      const session = ++aiGenerationSessionId;
      const qList = getActiveQuestionList();
      const currentQ = qList[currentQuestionIndex];
      if (!currentQ) return;

      const targetCards = trayCards.filter(c => !c.isConjunction && c.role !== 'distractor');
      if (targetCards.length === 0) return;

      const cardsNeedingGeneration = [];
      for (const card of targetCards) {
        const cacheKey = getCardCacheKey(card, currentArtStyle);
        if (!forceRegenerate) {
          const cached = await getCachedAIImage(cacheKey);
          if (cached) {
            card.aiImage = cached;
            card.isGeneratingAI = false;
            syncCardAIImageToQuestionBank(currentQ, card, cached);
            continue;
          }
        }
        card.isGeneratingAI = true;
        cardsNeedingGeneration.push(card);
      }

      updateTopAiStatusBadge(targetCards.length - cardsNeedingGeneration.length, targetCards.length, cardsNeedingGeneration.length > 0);
      updateTeacherAIStatus();
      if (currentScreen === 'training') renderWorkspace();

      if (cardsNeedingGeneration.length === 0) return;

      let completedCount = targetCards.length - cardsNeedingGeneration.length;
      const totalCount = targetCards.length;

      for (const card of cardsNeedingGeneration) {
        const cacheKey = getCardCacheKey(card, currentArtStyle);
        if (activeGenerations.has(cacheKey) && !forceRegenerate) continue;

        activeGenerations.add(cacheKey);
        card.isGeneratingAI = true;
        updateTopAiStatusBadge(completedCount, totalCount, true);
        updateTeacherAIStatus();
        if (currentScreen === 'training') renderWorkspace();

        const promptText = card.aiPrompt || `Cute round-faced 5-year-old Hong Kong child in daily life scene: "${card.written || card.cantonese}"`;
        const generatedDataUrl = await generateAIImageFromPrompt(promptText, currentArtStyle);

        activeGenerations.delete(cacheKey);
        card.isGeneratingAI = false;

        if (generatedDataUrl) {
          card.aiImage = generatedDataUrl;
          syncCardAIImageToQuestionBank(currentQ, card, generatedDataUrl);
          await setCachedAIImage(cacheKey, generatedDataUrl);
        }

        completedCount++;
        if (session === aiGenerationSessionId) {
          updateTopAiStatusBadge(completedCount, totalCount, completedCount < totalCount);
        }
        updateTeacherAIStatus();
        if (currentScreen === 'training') renderWorkspace();
      }

      if (session === aiGenerationSessionId) {
        updateTopAiStatusBadge(totalCount, totalCount, false);
      }
    }

    function syncCardAIImageToQuestionBank(questionObj, card, dataUrl) {
      if (!questionObj || !dataUrl) return;
      if (questionObj.steps && typeof card.stepNumber === 'number') {
        const stepObj = questionObj.steps[card.stepNumber - 1];
        if (stepObj) stepObj.aiImage = dataUrl;
      } else if (questionObj.cause && card.role === 'cause') {
        questionObj.cause.aiImage = dataUrl;
      } else if (questionObj.effect && card.role === 'effect') {
        questionObj.effect.aiImage = dataUrl;
      }
    }

    /********************************************************************
     * 5. AUDIO & SPEECH SYNTHESIS
     ********************************************************************/
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'pop') {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'place') {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.11);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'return') {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.11);
        } else if (type === 'success') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.2, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.09 + 0.3);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + idx * 0.09); osc.stop(now + idx * 0.09 + 0.31);
          });
        } else if (type === 'gentleHint') {
          [392.0, 349.23].forEach((freq, idx) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);
            gain.gain.setValueAtTime(0.15, now + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.14 + 0.22);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + idx * 0.14); osc.stop(now + idx * 0.14 + 0.23);
          });
        }
      } catch (e) {}
    }

    function speakText(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) setTimeout(callback, 400);
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = voiceLang;
      utter.rate = voiceRate;
      utter.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.toLowerCase() === voiceLang.toLowerCase()) ||
                        voices.find(v => v.lang.toLowerCase().includes('zh'));
      if (preferred) utter.voice = preferred;

      utter.onend = () => { if (callback) callback(); };
      utter.onerror = () => { if (callback) callback(); };
      window.speechSynthesis.speak(utter);
    }

    function getCardSpokenText(cardObj) {
      if (!cardObj) return '';
      if (cardObj.isConjunction) return cardObj.text;
      return textMode === 'written' ? (cardObj.written || cardObj.cantonese) : (cardObj.cantonese || cardObj.written);
    }

    function getCardDisplayText(cardObj) {
      if (!cardObj) return '';
      if (cardObj.isConjunction) return cardObj.text;
      if (textMode === 'none') return '';
      return textMode === 'written' ? (cardObj.written || cardObj.cantonese) : (cardObj.cantonese || cardObj.written);
    }

    function getSequenceWord(stepNum) {
      if (stepNum === 1) return '首先';
      if (stepNum === 2) return textMode === 'written' ? '接著' : '跟住';
      if (stepNum === 3) return '然後';
      return '最後';
    }

    function speakCurrentSentence(forceReadTargetIfEmpty = false) {
      if (isReadingKaraoke) {
        window.speechSynthesis && window.speechSynthesis.cancel();
        clearKaraokeHighlights();
        isReadingKaraoke = false;
        return;
      }

      const qList = getActiveQuestionList();
      const q = qList[currentQuestionIndex];
      let steps = [];

      if (activePatternId === 'sequence_4step') {
        for (let i = 1; i <= 4; i++) {
          const key = `step${i}`;
          const connWord = getSequenceWord(i);
          const cardObj = slots[key] || (forceReadTargetIfEmpty ? q.steps[i - 1] : null);
          const actionText = cardObj ? getCardSpokenText(cardObj) : `第${i}步`;
          steps.push({
            text: `${connWord}，${actionText}`,
            elIds: [`slot-step${i}`]
          });
        }
      } else {
        const causeText = slots.cause ? getCardSpokenText(slots.cause) : (forceReadTargetIfEmpty ? getCardSpokenText(q.cause) : '原因');
        const effectText = slots.effect ? getCardSpokenText(slots.effect) : (forceReadTargetIfEmpty ? getCardSpokenText(q.effect) : '結果');
        steps = [
          { text: `因為，${causeText}`, elIds: ['slot-cause'] },
          { text: `所以，${effectText}`, elIds: ['slot-effect'] }
        ];
      }

      isReadingKaraoke = true;
      let idx = 0;

      function playNext() {
        clearKaraokeHighlights();
        if (idx >= steps.length || !isReadingKaraoke) {
          isReadingKaraoke = false;
          return;
        }
        const cur = steps[idx];
        cur.elIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.add('karaoke-active');
        });
        idx++;
        speakText(cur.text, () => setTimeout(playNext, 120));
      }
      playNext();
    }

      document.querySelectorAll('.karaoke-active').forEach(el => el.classList.remove('karaoke-active'));
    }

    /********************************************************************
     * 7. LOADING QUESTIONS & RENDERING WORKSPACE
     ********************************************************************/
    function loadQuestion(index) {
      if (autoCheckTimer) clearTimeout(autoCheckTimer);
      const qList = getActiveQuestionList();
      if (index < 0) index = qList.length - 1;
      if (index >= qList.length) index = 0;
      currentQuestionIndex = index;

      clearKaraokeHighlights();
      isReadingKaraoke = false;
      targetSlotKey = null;
      isCurrentQuestionSolved = false;
      lockedCorrectSlots.clear();
      hideActionOverlay();

      updateProgressTopBar();
      const q = qList[currentQuestionIndex];

      if (activePatternId === 'sequence_4step') {
        slots = { step1: null, step2: null, step3: null, step4: null };
        const cards = q.steps.map((st, idx) => ({
          id: `card-step-${idx + 1}`,
          role: `step${idx + 1}`,
          stepNumber: idx + 1,
          isConjunction: false,
          cantonese: st.cantonese,
          written: st.written,
          sceneKey: st.sceneKey,
          aiPrompt: st.aiPrompt,
          aiImage: st.aiImage || null
        }));

        if (difficulty === 1) {
          slots.step1 = cards[0];
          slots.step4 = cards[3];
          lockedCorrectSlots.add('step1');
          lockedCorrectSlots.add('step4');
        }

        trayCards = shuffleArray(cards);
        if (trayCards.every((c, i) => c.stepNumber === i + 1)) {
          trayCards.reverse();
        }
      } else {
        slots = {
          conj1: difficulty === 3 ? null : { id: 'fixed-conj1', isConjunction: true, role: 'conj1', text: '因為' },
          cause: null,
          conj2: difficulty === 3 ? null : { id: 'fixed-conj2', isConjunction: true, role: 'conj2', text: '所以' },
          effect: null
        };

        const cards = [
          {
            id: 'card-cause',
            role: 'cause',
            isConjunction: false,
            cantonese: q.cause.cantonese,
            written: q.cause.written,
            sceneKey: q.cause.sceneKey,
            aiPrompt: q.cause.aiPrompt
          },
          {
            id: 'card-effect',
            role: 'effect',
            isConjunction: false,
            cantonese: q.effect.cantonese,
            written: q.effect.written,
            sceneKey: q.effect.sceneKey,
            aiPrompt: q.effect.aiPrompt
          }
        ];

        if (difficulty === 2 && q.distractors) {
          q.distractors.slice(0, 2).forEach((d, idx) => {
            cards.push({
              id: `card-dist-${idx}`,
              role: 'distractor',
              isConjunction: false,
              cantonese: d.cantonese,
              written: d.written || d.cantonese,
              sceneKey: d.sceneKey
            });
          });
        } else if (difficulty === 3) {
          cards.push({ id: 'card-conj-cause', role: 'conj1', isConjunction: true, text: '因為', cantonese: '因為', written: '因為' });
          cards.push({ id: 'card-conj-effect', role: 'conj2', isConjunction: true, text: '所以', cantonese: '所以', written: '所以' });
        }

        trayCards = shuffleArray(cards);
      }

      renderWorkspace();
    // ensureCurrentQuestionAIImages(false);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderFourStepTopZone(container) {
      const stepConfigs = [
        { key: 'step1', num: 1, word: getSequenceWord(1), bg: 'bg-orange-50/90 border-orange-200', badgeBg: 'bg-orange-500 border-orange-300', slotBorder: 'border-orange-300' },
        { key: 'step2', num: 2, word: getSequenceWord(2), bg: 'bg-sky-50/90 border-sky-200',       badgeBg: 'bg-sky-500 border-sky-300',       slotBorder: 'border-sky-300' },
        { key: 'step3', num: 3, word: getSequenceWord(3), bg: 'bg-purple-50/90 border-purple-200', badgeBg: 'bg-purple-500 border-purple-300', slotBorder: 'border-purple-300' },
        { key: 'step4', num: 4, word: getSequenceWord(4), bg: 'bg-emerald-50/90 border-emerald-200',badgeBg: 'bg-emerald-500 border-emerald-300',slotBorder: 'border-emerald-300' }
      ];

      container.className = 'grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-3.5 h-full items-stretch';
      container.innerHTML = stepConfigs.map(cfg => {
        const placed = slots[cfg.key];
        const isTargeted = targetSlotKey === cfg.key;
        const isLocked = lockedCorrectSlots.has(cfg.key);
        const displayText = placed ? getCardDisplayText(placed) : '';
        const headerBadgeClass = difficulty === 3 ? 'bg-slate-600 border-slate-400' : cfg.badgeBg;

        let slotInner = '';
        let slotClasses = '';

        if (!placed) {
          slotClasses = `flex-1 w-full rounded-2xl border-3 border-dashed ${cfg.slotBorder} bg-white flex flex-col items-center justify-center p-1 cursor-pointer transition-all ${isTargeted ? 'slot-targeted' : ''}`;
          slotInner = `<span class="text-2xl sm:text-4xl font-black text-slate-300">${cfg.num}</span>`;
        } else {
          const borderStyle = isLocked ? 'border-emerald-500 ring-2 ring-emerald-300' : 'border-amber-400';
          slotClasses = `flex-1 w-full rounded-2xl border-3 ${borderStyle} bg-white flex flex-col justify-between p-1 transition-all relative overflow-hidden cursor-pointer shadow-sm animate-pop`;
          slotInner = `
            ${isLocked ? `<span class="absolute top-1 right-1 z-10 bg-emerald-500 text-white text-[10px] sm:text-xs font-black px-1.5 py-0.5 rounded-full shadow">✅</span>` : ''}
            <div class="w-full ${displayText ? 'h-[78%]' : 'h-full'} rounded-xl overflow-hidden bg-slate-50">
              ${renderCardVisual(placed)}
            </div>
            ${displayText ? `
              <div class="h-[22%] flex items-center justify-center pt-0.5">
                <div class="text-[11px] sm:text-sm font-black text-slate-800 leading-tight truncate px-1">${displayText}</div>
              </div>

          `;
        }

        return `
          <div class="${cfg.bg} rounded-2xl sm:rounded-3xl p-1.5 sm:p-2.5 border-2 flex flex-col gap-1.5 h-full min-h-[115px]">
            <button type="button" onclick="speakText('${cfg.word}')" class="tactile-btn ${headerBadgeClass} text-white border px-2.5 py-1 rounded-xl flex items-center justify-center gap-1.5 shadow-sm shrink-0">
              <span class="w-5 h-5 rounded-full bg-white/25 text-xs font-black flex items-center justify-center">${cfg.num}</span>
              <span class="text-sm sm:text-lg font-black tracking-wider">${cfg.word}</span>
            </button>
            <div id="slot-${cfg.key}" data-slot-key="${cfg.key}" onclick="handleSlotTap('${cfg.key}')" class="${slotClasses}">
              ${slotInner}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCausalTopZone(container) {
      container.className = 'grid grid-cols-2 gap-2.5 sm:gap-5 h-full items-stretch';
      container.innerHTML = `
        <div class="bg-orange-50/90 rounded-3xl p-2 sm:p-3.5 border-3 border-orange-200 flex flex-col sm:flex-row items-center gap-2 sm:gap-3.5 h-full">
          <div id="conjSlot1Wrapper" class="shrink-0 flex items-center justify-center">
            <button onclick="speakText('因為')" class="tactile-btn bg-orange-500 hover:bg-orange-400 text-white border-2 border-orange-300 rounded-2xl px-3.5 py-1.5 sm:px-5 sm:py-5 flex items-center justify-center shadow">
              <span class="text-lg sm:text-3xl font-black tracking-widest">因為</span>
            </button>
          </div>
          <div id="slot-cause" data-slot-key="cause" onclick="handleSlotTap('cause')" class="flex-1 w-full h-full min-h-[115px] rounded-2xl border-4 border-dashed border-orange-300 bg-white flex flex-col items-center justify-center p-1.5 transition-all relative overflow-hidden cursor-pointer"></div>
        </div>

        <div class="bg-sky-50/90 rounded-3xl p-2 sm:p-3.5 border-3 border-sky-200 flex flex-col sm:flex-row items-center gap-2 sm:gap-3.5 h-full">
          <div id="conjSlot2Wrapper" class="shrink-0 flex items-center justify-center">
            <button onclick="speakText('所以')" class="tactile-btn bg-sky-500 hover:bg-sky-400 text-white border-2 border-sky-300 rounded-2xl px-3.5 py-1.5 sm:px-5 sm:py-5 flex items-center justify-center shadow">
              <span class="text-lg sm:text-3xl font-black tracking-widest">所以</span>
            </button>
          </div>
          <div id="slot-effect" data-slot-key="effect" onclick="handleSlotTap('effect')" class="flex-1 w-full h-full min-h-[115px] rounded-2xl border-4 border-dashed border-sky-300 bg-white flex flex-col items-center justify-center p-1.5 transition-all relative overflow-hidden cursor-pointer"></div>
        </div>
      `;

      ['cause', 'effect'].forEach(slotKey => {
        const slotEl = document.getElementById(`slot-${slotKey}`);
        const placed = slots[slotKey];
        const isTargeted = targetSlotKey === slotKey;

        if (!placed) {
          const isCause = slotKey === 'cause';
          slotEl.className = `flex-1 w-full h-full min-h-[115px] rounded-2xl border-4 border-dashed ${isCause ? 'border-orange-300' : 'border-sky-300'} bg-white flex items-center justify-center transition-all relative overflow-hidden cursor-pointer ${isTargeted ? 'slot-targeted' : ''}`;
          slotEl.innerHTML = `<span class="text-4xl sm:text-5xl opacity-80">${isCause ? '❓' : '💡'}</span>`;
        } else {
          const displayText = getCardDisplayText(placed);
          slotEl.className = `flex-1 w-full h-full min-h-[115px] rounded-2xl border-4 ${slotKey === 'cause' ? 'border-orange-400' : 'border-sky-400'} bg-white flex flex-col justify-between p-1.5 transition-all relative overflow-hidden cursor-pointer shadow-md animate-pop`;
          slotEl.innerHTML = `
            <div class="w-full ${displayText ? 'h-[80%]' : 'h-full'} rounded-xl overflow-hidden bg-slate-50">
              ${renderCardVisual(placed)}
            </div>
            ${displayText ? `
              <div class="h-[20%] flex items-center justify-center pt-1">
                <div class="text-xs sm:text-lg font-black text-slate-800 leading-none truncate px-1">${displayText}</div>
              </div>
            ` : ''}
          `;
        }
      });
    }

    function renderTray() {
      const trayEl = document.getElementById('cardTray');
      if (!trayEl) return;
      trayEl.innerHTML = '';

      const placedIds = new Set(Object.values(slots).filter(Boolean).map(c => c.id));
      const availableCards = trayCards.filter(c => !placedIds.has(c.id));

      trayEl.className = 'flex flex-wrap justify-center items-stretch gap-2.5 sm:gap-4 h-full w-full';

      if (availableCards.length === 0) {
        trayEl.innerHTML = `
          <div class="col-span-2 lg:col-span-4 flex items-center justify-center h-full">
            <span class="text-4xl sm:text-5xl animate-bounce">🌟</span>
          </div>
        `;
        return;
      }

      availableCards.forEach(card => {
        const displayText = getCardDisplayText(card);
        const cardEl = document.createElement('div');
        cardEl.dataset.cardId = card.id;
        cardEl.onpointerdown = (e) => handleCardPointerDown(e, card);

        cardEl.className = 'storybook-card cursor-pointer rounded-2xl sm:rounded-3xl p-1.5 sm:p-2 border-4 border-amber-300 bg-white hover:border-amber-400 flex flex-col justify-between h-full min-h-[115px] max-w-[240px] flex-1 basis-40 sm:basis-48 overflow-hidden';
        cardEl.innerHTML = `
          <div class="w-full ${displayText ? 'h-[80%]' : 'h-full'} rounded-xl sm:rounded-2xl overflow-hidden bg-slate-50">
            ${renderCardVisual(card)}
          </div>
          ${displayText ? `
            <div class="h-[20%] flex items-center justify-center pt-0.5">
              <div class="text-xs sm:text-lg font-black text-slate-800 leading-tight truncate px-1">
                ${displayText}
              </div>
            </div>
          ` : ''}
        `;
        trayEl.appendChild(cardEl);
      });
    }

    /********************************************************************
     * 8. TOUCH INTERACTION
     ********************************************************************/
    function handleCardPointerDown(e, card) {
      if (e.button && e.button !== 0) return;
      pointerDragState = {
        active: true,
        cardId: card.id,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        hoveredSlotKey: null
      };
    }

    function setupGlobalPointerListeners() {
      window.addEventListener('pointermove', (e) => {
        if (!pointerDragState.active) return;
        const dx = e.clientX - pointerDragState.startX;
        const dy = e.clientY - pointerDragState.startY;

        if (!pointerDragState.moved && Math.hypot(dx, dy) > 10) {
          pointerDragState.moved = true;
          const card = trayCards.find(c => c.id === pointerDragState.cardId);
          if (card) {
            playSound('pop');
            showTouchDragGhost(card, e.clientX, e.clientY);
          }
        }

        if (pointerDragState.moved) {
          moveTouchDragGhost(e.clientX, e.clientY);
          highlightSlotUnderPointer(e.clientX, e.clientY);
        }
      }, { passive: true });

      window.addEventListener('pointerup', () => {
        if (!pointerDragState.active) return;
        const { cardId, moved, hoveredSlotKey } = pointerDragState;
        pointerDragState.active = false;
        hideTouchDragGhost();
        clearSlotHoverHighlights();

        const card = trayCards.find(c => c.id === cardId);
        if (!card) return;

        if (moved && hoveredSlotKey && !lockedCorrectSlots.has(hoveredSlotKey)) {
          placeCardIntoSlot(card, hoveredSlotKey);
        } else if (!moved) {
          handleCardDirectTap(card);
        }
      });
    }

    function handleCardDirectTap(card) {
      let destSlot = null;

      if (targetSlotKey && !slots[targetSlotKey] && !lockedCorrectSlots.has(targetSlotKey)) {
        destSlot = targetSlotKey;
      } else if (activePatternId === 'sequence_4step') {
        for (let i = 1; i <= 4; i++) {
          const k = `step${i}`;
          if (!slots[k]) { destSlot = k; break; }
        }
      } else {
        if (!slots.cause) destSlot = 'cause';
        else if (!slots.effect) destSlot = 'effect';
      }

      if (destSlot) {
        placeCardIntoSlot(card, destSlot);
      } else {
        playSound('pop');
        speakText(getCardSpokenText(card));
      }
    }

    function placeCardIntoSlot(card, slotKey) {
      if (lockedCorrectSlots.has(slotKey)) return;
      hideActionOverlay();
      slots[slotKey] = card;
      targetSlotKey = null;
      playSound('place');
      speakText(getCardSpokenText(card));
      renderWorkspace();
      scheduleAutoCheckIfFull();
    }

    function handleSlotTap(slotKey) {
      if (isCurrentQuestionSolved || lockedCorrectSlots.has(slotKey)) {
        if (slots[slotKey]) speakText(getCardSpokenText(slots[slotKey]));
        return;
      }
      hideActionOverlay();

      if (slots[slotKey]) {
        slots[slotKey] = null;
        targetSlotKey = null;
        playSound('return');
        renderWorkspace();
      } else {
        playSound('pop');
        targetSlotKey = (targetSlotKey === slotKey) ? null : slotKey;
        renderWorkspace();
      }
    }

    function showTouchDragGhost(card, x, y) {
      const ghost = document.getElementById('touchDragGhost');
      if (!ghost) return;
      const displayText = getCardDisplayText(card);
      ghost.innerHTML = `
        <div class="w-full h-full rounded-2xl p-1.5 bg-white border-4 border-amber-400 shadow-2xl flex flex-col justify-between overflow-hidden">
          <div class="w-full ${displayText ? 'h-[78%]' : 'h-full'} rounded-xl overflow-hidden bg-slate-100">
            ${renderCardVisual(card)}
          </div>
          ${displayText ? `<div class="text-xs font-black text-slate-800 text-center truncate px-1">${displayText}</div>` : ''}
        </div>
      `;
      ghost.style.left = `${x}px`;
      ghost.style.top = `${y}px`;
      ghost.classList.remove('hidden');
    }

    function moveTouchDragGhost(x, y) {
      const ghost = document.getElementById('touchDragGhost');
      if (!ghost) return;
      ghost.style.left = `${x}px`;
      ghost.style.top = `${y}px`;
    }

    function hideTouchDragGhost() {
      const ghost = document.getElementById('touchDragGhost');
      if (ghost) ghost.classList.add('hidden');
    }

    function highlightSlotUnderPointer(x, y) {
      clearSlotHoverHighlights();
      const elUnder = document.elementFromPoint(x, y);
      if (!elUnder) {
        pointerDragState.hoveredSlotKey = null;
        return;
      }
      const slotContainer = elUnder.closest('[data-slot-key]');
      if (slotContainer && !lockedCorrectSlots.has(slotContainer.dataset.slotKey)) {
        pointerDragState.hoveredSlotKey = slotContainer.dataset.slotKey;
        slotContainer.classList.add('slot-hover-target');
      } else {
        pointerDragState.hoveredSlotKey = null;
      }
    }

    function clearSlotHoverHighlights() {
      document.querySelectorAll('[data-slot-key]').forEach(el => el.classList.remove('slot-hover-target'));
    }

    /********************************************************************
     * 9. AUTO-EVALUATION & POSITIVE SEN FEEDBACK
     ********************************************************************/
    function scheduleAutoCheckIfFull() {
      if (autoCheckTimer) clearTimeout(autoCheckTimer);

      if (activePatternId === 'sequence_4step') {
        const allFourFilled = Boolean(slots.step1 && slots.step2 && slots.step3 && slots.step4);
        if (allFourFilled) {
          autoCheckTimer = setTimeout(evaluateFourStepSequence, 420);
        }
      } else {
        const hasBoth = Boolean(slots.cause && slots.effect);
        if (hasBoth) {
          autoCheckTimer = setTimeout(evaluateCausalAnswer, 420);
        }
      }
    }

    function evaluateFourStepSequence() {
      const keys = ['step1', 'step2', 'step3', 'step4'];
      const wrongKeys = [];

      keys.forEach((k, idx) => {
        if (slots[k] && slots[k].stepNumber === idx + 1) {
          lockedCorrectSlots.add(k);
        } else {
          wrongKeys.push(k);
        }
      });

      renderWorkspace();

      if (wrongKeys.length === 0) {
        isCurrentQuestionSolved = true;
        playSound('success');
        launchConfetti();
        addStarReward();
        showNextQuestionButton();
        setTimeout(() => speakCurrentSentence(false), 300);
        return;
      }

      playSound('gentleHint');
      wrongKeys.forEach(k => {
        const el = document.getElementById(`slot-${k}`);
        if (el) {
          el.classList.add('shake-feedback');
          setTimeout(() => el.classList.remove('shake-feedback'), 600);
        }
      });

      const correctCount = 4 - wrongKeys.length;
      if (correctCount > 0) {
        speakText(`做得好，有 ${correctCount} 張擺啱咗喇！試下調轉埋其餘圖卡啦！`);
      } else {
        speakText('諗下邊樣做先，邊樣做最後？試下調轉佢哋啦！');
      }

      showSequenceHelperButtons(wrongKeys);
    }

    function showSequenceHelperButtons(wrongKeys) {
      const bar = document.getElementById('actionOverlayBar');
      const content = document.getElementById('actionOverlayContent');
      bar.classList.remove('hidden');

      content.innerHTML = `
        <button onclick="returnWrongSequenceCards()" class="tactile-btn bg-amber-500 hover:bg-amber-400 text-white border-3 border-white px-4 sm:px-6 py-2 rounded-full font-black text-sm sm:text-lg shadow-xl flex items-center gap-1.5 animate-pop">
          <span>↩️</span>
          <span>重排錯嘅卡</span>
        </button>
        <button onclick="autoFixSequenceCards()" class="tactile-btn bg-orange-500 hover:bg-orange-400 text-white border-3 border-white px-4 sm:px-6 py-2 rounded-full font-black text-sm sm:text-lg shadow-xl flex items-center gap-1.5 animate-pop">
          <span>🔄</span>
          <span>幫手調啱位置</span>
        </button>
      `;
    }

    function returnWrongSequenceCards() {
      playSound('return');
      ['step1', 'step2', 'step3', 'step4'].forEach(k => {
        if (!lockedCorrectSlots.has(k)) slots[k] = null;
      });
      hideActionOverlay();
      renderWorkspace();
    }

    function autoFixSequenceCards() {
      playSound('place');
      ['step1', 'step2', 'step3', 'step4'].forEach((k, idx) => {
        const rightCard = trayCards.find(c => c.stepNumber === idx + 1);
        if (rightCard) slots[k] = rightCard;
      });
      hideActionOverlay();
      renderWorkspace();
      scheduleAutoCheckIfFull();
    }

    function evaluateCausalAnswer() {
      const isCauseOk = slots.cause && slots.cause.role === 'cause';
      const isEffectOk = slots.effect && slots.effect.role === 'effect';

      if (isCauseOk && isEffectOk) {
        isCurrentQuestionSolved = true;
        playSound('success');
        launchConfetti();
        addStarReward();
        showNextQuestionButton();
        setTimeout(() => speakCurrentSentence(false), 300);
        return;
      }

      const isSwapped = slots.cause && slots.effect && slots.cause.role === 'effect' && slots.effect.role === 'cause';
      if (isSwapped) {
        playSound('gentleHint');
        speakText('諗下邊樣發生先？試下調轉佢哋啦！');
        ['slot-cause', 'slot-effect'].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.classList.add('shake-feedback');
            setTimeout(() => el.classList.remove('shake-feedback'), 600);
          }
        });
        showCausalSwapButton();
        return;
      }

      playSound('gentleHint');
      speakText('唔係呢張喎，再試一次啦！');
      setTimeout(() => {
        if (!isCauseOk) slots.cause = null;
        if (!isEffectOk) slots.effect = null;
        playSound('return');
        renderWorkspace();
      }, 600);
    }

    function showCausalSwapButton() {
      const bar = document.getElementById('actionOverlayBar');
      const content = document.getElementById('actionOverlayContent');
      bar.classList.remove('hidden');
      content.innerHTML = `
        <button onclick="swapCausalCards()" class="tactile-btn bg-orange-500 hover:bg-orange-400 text-white border-4 border-white px-7 py-2.5 rounded-full font-black text-base sm:text-xl shadow-xl flex items-center gap-2 animate-pop">
          <span>🔄</span><span>調轉圖卡</span>
        </button>
      `;
    }

    function swapCausalCards() {
      playSound('place');
      const tmp = slots.cause;
      slots.cause = slots.effect;
      slots.effect = tmp;
      hideActionOverlay();
      renderWorkspace();
      scheduleAutoCheckIfFull();
    }

    function showNextQuestionButton() {
      const bar = document.getElementById('actionOverlayBar');
      const content = document.getElementById('actionOverlayContent');
      bar.classList.remove('hidden');

      const qList = getActiveQuestionList();
      const isLast = currentQuestionIndex === qList.length - 1;

      if (isLast) {
        content.innerHTML = `
          <button onclick="goToHomeScreen()" class="tactile-btn bg-amber-400 hover:bg-amber-300 text-slate-900 border-4 border-white px-5 py-2 rounded-full font-black text-base sm:text-xl shadow-xl flex items-center gap-2 animate-bounce">
            <span>🏠</span><span>完成返主頁</span>
          </button>
          <button onclick="nextQuestion()" class="tactile-btn bg-emerald-500 hover:bg-emerald-400 text-white border-4 border-white px-5 py-2 rounded-full font-black text-base sm:text-xl shadow-xl flex items-center gap-2 animate-bounce">
            <span>再玩一輪</span><span>🔄</span>
          </button>
        `;
      } else {
        content.innerHTML = `
          <button onclick="nextQuestion()" class="tactile-btn bg-emerald-500 hover:bg-emerald-400 text-white border-4 border-white px-7 py-2.5 rounded-full font-black text-lg sm:text-2xl shadow-xl flex items-center gap-2.5 animate-bounce">
            <span>下一題</span><span class="text-xl sm:text-2xl">➡️</span>
          </button>
        `;
      }
    }

    function hideActionOverlay() {
      const bar = document.getElementById('actionOverlayBar');
      if (bar) bar.classList.add('hidden');
    }

    function addStarReward() {
      starCount++;
      localStorage.setItem('sen_causal_stars', String(starCount));

      const qList = getActiveQuestionList();
      const q = qList[currentQuestionIndex];
      if (q && q.id) {
        completedQuestionIds.add(q.id);
        try {
          localStorage.setItem('sen_completed_qids_v2', JSON.stringify([...completedQuestionIds]));
        } catch (e) {}
      }
      updateProgressTopBar();
    }

    function prevQuestion() {
      playSound('pop');
      loadQuestion(currentQuestionIndex - 1);
    }

    function nextQuestion() {
      playSound('pop');
      loadQuestion(currentQuestionIndex + 1);
    }

    function jumpToQuestion(idxStr) {
      playSound('pop');
      const idx = parseInt(idxStr, 10);
      if (!isNaN(idx)) {
        closeTeacherModal();
        if (currentScreen !== 'training') {
          currentScreen = 'training';
          document.getElementById('homeScreen').classList.add('hidden');
          document.getElementById('trainingScreen').classList.remove('hidden');
        }
        loadQuestion(idx);
      }
    }

     * 10. TEACHER MODAL & AI WORKSHOP
     ********************************************************************/
    function openTeacherModal() {
      playSound('pop');
      aiWorkshopTargetPattern = activePatternId;
      updateTeacherControlsUI();
      renderStyleOptionsGrid();
      document.getElementById('teacherModal').classList.remove('hidden');
    }

      document.getElementById('teacherModal').classList.add('hidden');

      playSound('pop');
      aiWorkshopTargetPattern = patId;
      updateTeacherControlsUI();
    }

    function selectPatternFromModal(patId) {
      closeTeacherModal();
      enterSentencePatternTraining(patId);
    }

    function toggleShowFuturePatterns() {
      playSound('pop');
      showFuturePatterns = !showFuturePatterns;
      updateTeacherControlsUI();
      renderHomeScreen();
    }

    function updateTeacherControlsUI() {
      const cBtn = document.getElementById('modalPatCausalBtn');
      const sBtn = document.getElementById('modalPatSeqBtn');
      if (cBtn && sBtn) {
        cBtn.className = activePatternId === 'because_therefore'
          ? 'py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 bg-emerald-500 text-white border-emerald-600 flex items-center justify-between'
          : 'py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 bg-white text-slate-700 border-slate-200 flex items-center justify-between';
        sBtn.className = activePatternId === 'sequence_4step'
          ? 'py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 bg-sky-500 text-white border-sky-600 flex items-center justify-between'
          : 'py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm border-2 bg-white text-slate-700 border-slate-200 flex items-center justify-between';
      }

      const select = document.getElementById('questionSelect');
      if (select) {
        select.innerHTML = '';
        const qList = getActiveQuestionList();
        qList.forEach((q, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          if (activePatternId === 'sequence_4step') {
            opt.textContent = `${idx + 1}. 【${q.title || '四步次序'}】${q.steps[0].cantonese} ➔ ... ➔ ${q.steps[3].cantonese}`;
          } else {
            opt.textContent = `${idx + 1}. 因為「${q.cause.cantonese}」➔ 所以「${q.effect.cantonese}」`;
          }
          select.appendChild(opt);
        });
        select.value = currentQuestionIndex;
      }

      [1, 2, 3].forEach(lvl => {
        const el = document.getElementById(`diffBtn${lvl}`);
        if (el) {
          el.className = difficulty === lvl
            ? 'py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2 bg-amber-400 text-slate-900 border-amber-500 shadow-sm'
            : 'py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm border-2 bg-white text-slate-600 border-slate-200';
        }
      });

      const descEl = document.getElementById('diffDescText');
      if (descEl) {
        if (activePatternId === 'sequence_4step') {
          descEl.textContent = difficulty === 1
            ? '🌱 初階：已自動固定第1步同第4步，小朋友只需排列中間2張圖卡。'
            : (difficulty === 2 ? '🌿 中階：完整4步次序圖卡自由排列，附彩色編號提示。' : '🌳 高階：完整4步排列，隱藏顏色提示。');
        } else {
          descEl.textContent = difficulty === 1
            ? '🌱 初階：2張因果圖卡直接配對。'
            : (difficulty === 2 ? '🌿 中階：加入2張干擾圖卡（4選2）。' : '🌳 高階：連同連接詞重組句子。');
        }
      }

      [
        { id: 'tmBtnCantonese', m: 'cantonese' },
        { id: 'tmBtnWritten', m: 'written' },
        { id: 'tmBtnNone', m: 'none' }
      ].forEach(item => {
        const el = document.getElementById(item.id);
        if (el) {
          el.className = textMode === item.m
            ? 'py-2 px-1.5 rounded-xl font-black text-xs border-2 bg-emerald-500 text-white border-emerald-600'
            : 'py-2 px-1.5 rounded-xl font-black text-xs border-2 bg-white text-slate-600 border-slate-200';
        }
      });

      const fBtn = document.getElementById('showFutureToggleBtn');
      if (fBtn) {
        fBtn.textContent = showFuturePatterns ? '顯示中' : '已隱藏';
        fBtn.className = showFuturePatterns
          ? 'px-3 py-1.5 rounded-xl font-black text-xs border-2 bg-indigo-600 text-white border-indigo-700'
          : 'px-3 py-1.5 rounded-xl font-black text-xs border-2 bg-white text-slate-600 border-slate-300';
      }

      const genCausalBtn = document.getElementById('aiGenModeCausalBtn');
      const genSeqBtn = document.getElementById('aiGenModeSeqBtn');
      if (genCausalBtn && genSeqBtn) {
        genCausalBtn.className = aiWorkshopTargetPattern === 'because_therefore'
          ? 'px-2.5 py-1 rounded-lg text-xs font-black bg-indigo-600 text-white'
          : 'px-2.5 py-1 rounded-lg text-xs font-black text-slate-600 hover:bg-slate-100';
        genSeqBtn.className = aiWorkshopTargetPattern === 'sequence_4step'
          ? 'px-2.5 py-1 rounded-lg text-xs font-black bg-indigo-600 text-white'
          : 'px-2.5 py-1 rounded-lg text-xs font-black text-slate-600 hover:bg-slate-100';
      }

      updateProgressTopBar();
    }

    function setDifficulty(lvl) {
      playSound('pop');
      difficulty = lvl;
      updateTeacherControlsUI();
      if (currentScreen === 'training') loadQuestion(currentQuestionIndex);
    }

    function setTextMode(mode) {
      playSound('pop');
      textMode = mode;
      updateTeacherControlsUI();
      if (currentScreen === 'training') renderWorkspace();
      else renderHomeScreen();
    }

    function toggleVoiceLang() {
      playSound('pop');
      voiceLang = voiceLang === 'zh-HK' ? 'zh-CN' : 'zh-HK';
      const btn = document.getElementById('voiceLangBtn');
      if (btn) btn.textContent = voiceLang === 'zh-HK' ? '🔊 粵語發音' : '🔊 普通話發音';
    }

    function toggleVoiceSpeed() {
      playSound('pop');
      voiceRate = voiceRate === 0.85 ? 1.0 : 0.85;
      const btn = document.getElementById('voiceSpeedBtn');
      if (btn) btn.textContent = voiceRate === 0.85 ? '🐢 慢速朗讀' : '🐇 正常語速';
    }

    function renderStyleOptionsGrid() {
      const grid = document.getElementById('styleOptionsGrid');
      if (!grid) return;
      grid.innerHTML = '';
      Object.values(AI_ART_STYLES).forEach(st => {
        const isCurrent = st.id === currentArtStyle;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => {
          playSound('pop');
          currentArtStyle = st.id;
          localStorage.setItem('sen_ai_art_style', st.id);
          renderStyleOptionsGrid();
          trayCards.forEach(c => { if (!c.isConjunction) c.aiImage = null; });
          ensureCurrentQuestionAIImages(false);
        };
        btn.className = `p-2 rounded-xl border-2 text-xs font-black ${isCurrent ? 'bg-fuchsia-600 text-white border-fuchsia-700' : 'bg-white text-slate-700 border-fuchsia-200'}`;
        btn.textContent = st.name;
        grid.appendChild(btn);
      });
    }

    function fillTopicChip(text) {
      const input = document.getElementById('aiTopicInput');
      if (input) input.value = text;
    }

    async function handleGenerateFromTopic() {
      const input = document.getElementById('aiTopicInput');
      const topic = input.value.trim();
      if (!topic) return input.focus();

      const btn = document.getElementById('aiGenerateTopicBtn');
      const box = document.getElementById('workshopStatusBox');
      const txt = document.getElementById('workshopStatusText');

      btn.disabled = true;
      box.classList.remove('hidden');
      const targetMode = aiWorkshopTargetPattern || activePatternId;
      txt.textContent = `正在根據「${topic}」設計題目與 AI 圖卡...`;

      try {
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        if (targetMode === 'sequence_4step') {
          const payload = {
            contents: [{
              role: 'user',
              parts: [{
                text: `你是一位香港幼兒言語治療師。請根據主題「${topic}」，設計一題4步先後次序句式（首先、跟住、然後、最後）。請使用香港道地廣東話（例如用「抹面」而非「抹臉」），每步4至7字，並為每一步提供具體描述同一位5歲可愛圓臉香港小朋友連續完成動作的英文 imagePrompt。`
              }]
            }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  title: { type: 'STRING' },
                  steps: {
                    type: 'ARRAY',
                    items: {
                      type: 'OBJECT',
                      properties: {
                        cantonese: { type: 'STRING' },
                        written: { type: 'STRING' },
                        imagePrompt: { type: 'STRING' }
                      },
                      required: ['cantonese', 'written', 'imagePrompt']
                    }
                  }
                },
                required: ['title', 'steps']
              }
            }
          };

          const res = await fetchWithRetry(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }, 2);
          const parsed = JSON.parse(res?.candidates?.[0]?.content?.parts?.[0]?.text);
          const qId = 'seq_ai_' + Date.now();
          const newSteps = (parsed.steps || []).slice(0, 4).map((s, idx) => ({
            cantonese: s.cantonese,
            written: s.written,
            sceneKey: `s1_${idx + 1}`,
            aiPrompt: s.imagePrompt
          }));

          if (newSteps.length === 4) {
            seqQuestions.push({ id: qId, title: parsed.title || topic, steps: newSteps });
            input.value = '';
            closeTeacherModal();
            enterSentencePatternTraining('sequence_4step');
            loadQuestion(seqQuestions.length - 1);
          }
        } else {
          const payload = {
            contents: [{
              role: 'user',
              parts: [{
                text: `你是一位香港幼兒言語治療師。請根據主題「${topic}」，設計一題「因為…所以…」因果句式（4至7字香港口語，用「抹面」而非「抹臉」）。`
              }]
            }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  causeCantonese: { type: 'STRING' },
                  causeWritten: { type: 'STRING' },
                  causeImagePrompt: { type: 'STRING' },
                  effectCantonese: { type: 'STRING' },
                  effectWritten: { type: 'STRING' },
                  effectImagePrompt: { type: 'STRING' }
                },
                required: ['causeCantonese', 'causeWritten', 'causeImagePrompt', 'effectCantonese', 'effectWritten', 'effectImagePrompt']
              }
            }
          };

          const res = await fetchWithRetry(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }, 2);
          const parsed = JSON.parse(res?.candidates?.[0]?.content?.parts?.[0]?.text);
          const qId = 'c_ai_' + Date.now();
          causalQuestions.push({
            id: qId,
            cause: { cantonese: parsed.causeCantonese, written: parsed.causeWritten, sceneKey: 'rain_cause', aiPrompt: parsed.causeImagePrompt },
            effect: { cantonese: parsed.effectCantonese, written: parsed.effectWritten, sceneKey: 'rain_effect', aiPrompt: parsed.effectImagePrompt },
            distractors: DEFAULT_CAUSAL_QUESTIONS[0].distractors
          });
          input.value = '';
          closeTeacherModal();
          enterSentencePatternTraining('because_therefore');
          loadQuestion(causalQuestions.length - 1);
        }
      } catch (e) {
        txt.textContent = '⚠️ 生成失敗，請再試一次。';
      } finally {
        btn.disabled = false;
        setTimeout(() => box.classList.add('hidden'), 900);
      }
    }

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#F97316', '#0EA5E9', '#10B981', '#FACC15', '#EC4899', '#8B5CF6'];
      const particles = Array.from({ length: 55 }, () => ({
        x: canvas.width / 2 + (Math.random() - 0.5) * 180,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 15,
        vy: -Math.random() * 14 - 4,
        size: Math.random() * 8 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.2
      }));

      let frame = 0;
      function animate() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.42;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        if (frame < 70) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(animate);
    }

    window.onload = initApp;
  </script>
